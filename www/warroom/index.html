<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Draft War Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8F%88%3C/text%3E%3C/svg%3E">
<style>
/* Fully self-contained. The War Room is detached from the GGGG section and from
   scbl.ink's football pages by design — it shares no CSS, no JS and no data with
   them, so nothing about draft day can break because a league page changed. */
:root{
  --bg:#12100e; --surface:#1b1815; --surface2:#242019; --border:#3a332a;
  --text:#f2ede6; --muted:#9b9184; --accent:#e8a33d; --accent-dim:#7a5a24;
  --green:#5aa469; --red:#c8503c; --amber:#e8a33d; --blue:#5b8fb9;
  --qb:#c8503c; --rb:#5aa469; --wr:#5b8fb9; --te:#e8a33d; --k:#8d7bb0; --def:#7d7466;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;padding-bottom:24px}
a{color:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:0 12px}

/* ---- sticky status bar: the only thing that matters while on the clock ---- */
.bar{position:sticky;top:0;z-index:50;background:var(--bg);
  border-bottom:2px solid var(--border);padding:8px 0}
.bar.you{background:linear-gradient(180deg,rgba(232,163,61,.22),rgba(232,163,61,.05));
  border-bottom-color:var(--accent)}
.barin{max-width:1400px;margin:0 auto;padding:0 12px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:2px solid var(--border);background:var(--surface);padding:4px 9px;
  font-size:12px;font-family:var(--mono);white-space:nowrap}
.chip b{color:var(--accent);font-size:15px}
.chip.live{border-color:var(--green)}
.chip.hot{border-color:var(--accent);background:rgba(232,163,61,.16)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);
  margin-right:5px;vertical-align:middle}
.dot.on{background:var(--green);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.onclock{font-size:15px;font-weight:700}
.onclock.me{color:var(--accent)}
h1{font-size:19px;margin:14px 0 2px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
select,button.btn,input{background:var(--surface);color:var(--text);border:2px solid var(--border);
  padding:5px 8px;font-size:13px;font-family:inherit;max-width:100%}
select{max-width:min(46vw,320px)}
input::placeholder{color:var(--muted)}

.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin:18px 0 7px;font-weight:700}
.cols{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.blk{border:2px solid var(--border);background:var(--surface)}
.blkh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 9px;
  background:var(--surface2);border-bottom:2px solid var(--border)}
.blkh .n{font-size:12px;font-weight:800;letter-spacing:.06em}
.blkh .m{font-size:11px;color:var(--muted);font-family:var(--mono)}
.row{display:flex;align-items:center;gap:7px;padding:5px 9px;font-size:13px;
  border-bottom:1px solid rgba(255,255,255,.05)}
.row:last-child{border-bottom:0}
.row .r{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:38px}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sm{font-size:11px;color:var(--muted);font-family:var(--mono)}
.row.top{background:rgba(90,164,105,.13)}
.row.gone{opacity:.35;text-decoration:line-through}
.tiertag{font-size:10px;color:var(--amber);border:1px solid var(--amber);border-radius:2px;
  padding:0 3px;margin-left:2px;font-family:var(--mono)}
.pill{display:inline-block;padding:1px 5px;font-size:10px;font-weight:800;font-family:var(--mono)}
.pill.QB{background:var(--qb)}.pill.RB{background:var(--rb)}.pill.WR{background:var(--wr)}
.pill.TE{background:var(--te);color:#1b1815}.pill.K{background:var(--k)}.pill.DEF{background:var(--def)}
.alert{border:2px solid var(--amber);background:rgba(232,163,61,.1);padding:7px 10px;
  font-size:13px;margin-bottom:7px}
.alert.hot{border-color:var(--red);background:rgba(200,80,60,.13)}
.slot{display:inline-block;border:2px solid var(--border);padding:3px 7px;font-size:12px;
  margin:0 5px 5px 0;font-family:var(--mono)}
.slot.f{border-color:var(--green);color:var(--green)}
.slot.o{border-color:var(--amber);color:var(--amber)}
.srcs{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:-.02em}
.two{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.msg{padding:24px 12px;color:var(--muted);text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:4px 7px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono)}
.scroll{overflow-x:auto}
.pos{color:var(--green)}.neg{color:var(--red)}
@media(max-width:560px){.two{grid-template-columns:1fr}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="bar" id="bar"><div class="barin" id="barin">
  <span class="chip">Loading&hellip;</span>
</div></div>

<div class="wrap">
  <h1 id="title">Draft War Room</h1>
  <p class="sub" id="sub">Finding your drafts&hellip;</p>
  <div id="alerts"></div>
  <div id="body"></div>
</div>

<script>
/* ============================================================================
 * Draft War Room — pre-draft prep + live draft companion, for one person.
 *
 * Data:
 *   data/board.json  — blended consensus board (warroom-update.py). Five sources
 *                      reduced to one median ranking, component ranks retained.
 *   Sleeper API      — live draft state, polled directly from the browser.
 *
 * Refresh: picks are polled every 1s. Sleeper puts a 30s CDN cache in front of
 * that endpoint (cache-control: s-maxage=30), so each request carries a unique
 * query param — verified to return cf-cache-status: MISS, i.e. genuinely fresh
 * data from origin rather than a cached copy. 2 requests/tick (draft + picks)
 * puts this at ~120 req/min, still well under Sleeper's ~1000/min guidance.
 *
 * Push notifications do NOT come from this page. A server-side watcher on the
 * beelink box (draft-notify.py) sends them, because a browser tab cannot be
 * trusted to fire an alert when the phone is locked — which is exactly when the
 * alert matters. This page and the watcher share only the board.json contract.
 * ========================================================================== */

const API = 'https://api.sleeper.app/v1';
const POLL_PICKS_MS = 1000;    // live picks — the 1s the whole page exists for
const POLL_DRAFTS_MS = 30000;  // which drafts exist changes slowly
const POSES = ['QB','RB','WR','TE','K','DEF'];
const SRC_ORDER = ['fp','espn','fcalc','ffc_adp','espn_adp'];

const qs = new URLSearchParams(location.search);
const USER = qs.get('user') || 'footspencerball';

let BOARD = null, BYPID = new Map(), SOURCES = {};
let userId = null, drafts = [], active = null, draftInfo = null;
let picks = [], unavailable = new Set(), lastSig = '', pickTimer = null, myRosterId = null;
/* Remember the last draft you were looking at across reloads. ?draft= always
   wins (an explicit link), otherwise fall back to whatever was last pinned —
   on draft day you'll reload this page, and re-picking a mock out of a growing
   list every time would be a real annoyance. */
const LAST_DRAFT_KEY = 'wr_last_draft';
let pinnedId = qs.get('draft') || localStorage.getItem(LAST_DRAFT_KEY) || null;

/* Draft slot. Defaults to 3; 'auto' defers to whatever Sleeper reports.
   Persisted, so it survives the reloads you'll inevitably do on draft day. */
const SLOT_KEY = 'wr_slot';
let slotOverride = (() => {
  const q = qs.get('slot');
  if(q) return q === 'auto' ? 'auto' : Number(q);
  const saved = localStorage.getItem(SLOT_KEY);
  if(saved) return saved === 'auto' ? 'auto' : Number(saved);
  return 3;
})();
function setSlot(v){
  slotOverride = (v === 'auto') ? 'auto' : Number(v);
  try { localStorage.setItem(SLOT_KEY, String(slotOverride)); } catch(e){}
  render(true);
}

/* Several mocks off the same league all carry that league's name, so the name
   alone can't tell them apart. Lead with status, then the creation time, then a
   short id — enough to distinguish iterations started minutes apart. */
function draftLabel(d){
  const base = (d.metadata && d.metadata.name) || (d.league_id ? 'League' : 'Mock');
  const kind = d.league_id ? '' : ' (mock)';
  const when = d.created ? new Date(d.created) : (d.start_time ? new Date(d.start_time) : null);
  const t = when ? when.toLocaleString([], {month:'numeric', day:'numeric',
                                            hour:'numeric', minute:'2-digit'}) : '';
  const st = d.status === 'drafting' ? '● LIVE' : (d.status === 'complete' ? 'done' : 'pre');
  return `${st} · ${base}${kind}${t?` · ${t}`:''} · …${String(d.draft_id).slice(-4)}`;
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = id => document.getElementById(id);

async function jget(url, bust){
  // bust=true forces past Sleeper's 30s edge cache for genuinely live data.
  const u = bust ? url + (url.includes('?')?'&':'?') + '_=' + Date.now() : url;
  const r = await fetch(u, { cache:'no-store' });
  if(!r.ok) throw new Error(r.status + ' ' + url);
  return r.json();
}

/* ---- snake helpers ------------------------------------------------------- */
function slotForPick(overall, teams){
  const r = Math.ceil(overall/teams), i = overall - (r-1)*teams;
  return (r % 2 === 1) ? i : (teams - i + 1);
}
function picksForSlot(slot, teams, rounds){
  const out = [];
  for(let r=1;r<=rounds;r++){
    const i = (r%2===1) ? slot : (teams-slot+1);
    out.push({round:r, overall:(r-1)*teams+i});
  }
  return out;
}

/* ---- boot --------------------------------------------------------------- */
async function boot(){
  try {
    BOARD = await jget('data/board.json');
    BOARD.players.forEach(p => BYPID.set(String(p.pid), p));
    SOURCES = BOARD.sources || {};
  } catch(e){
    el('sub').textContent = 'Consensus board unavailable — run warroom-update.py.';
    return;
  }
  try {
    const u = await jget(`${API}/user/${encodeURIComponent(USER)}`);
    userId = u && u.user_id;
    if(!userId) throw new Error('no user');
    el('title').textContent = `Draft War Room · ${u.display_name}`;
  } catch(e){
    el('sub').textContent = `Could not resolve Sleeper user "${esc(USER)}". Add ?user=<username>.`;
    return;
  }
  await findDrafts();
  setInterval(findDrafts, POLL_DRAFTS_MS);
}

/* Draft discovery.
 *
 * IMPORTANT: Sleeper's /user/<id>/drafts endpoint returns LEAGUE drafts only —
 * mock drafts never appear in it (verified across 2026, 2025 and 2024), and
 * /league/<id>/drafts doesn't list them either. There is no discovery endpoint
 * for mocks, so they cannot be found automatically no matter how we poll.
 *
 * Mocks therefore have to be pointed at explicitly: paste the draft link or id
 * once and it's remembered in localStorage. Everything downstream treats a mock
 * exactly like a league draft.
 */
/* ---- registering a draft for push alerts --------------------------------
 * Mock drafts don't exist in any Sleeper listing endpoint, so the server has no
 * way to learn about one. This page is the only thing that knows, and it's
 * static — so it hands the draft id to the watcher over ntfy, which is already
 * running for the alerts themselves.
 *
 * The token below is deliberately public and deliberately boring: it belongs to
 * an ntfy user with WRITE-ONLY access to the single topic 'draftwatch'. Verified
 * it cannot publish to 'homelab' (403), cannot read 'draftwatch' (403), and
 * cannot read 'homelab' (403) — so it can't reach your alerts or send you
 * anything. The worst it allows is posting junk draft ids, which the watcher
 * validates against Sleeper and discards.
 */
const NTFY_URL   = 'https://ntfy.scbl.ink/draftwatch';
const NTFY_TOKEN = 'tk_lgxroxgzwyqqn5svkp24md0awz2ie';
const REREGISTER_MS = 10 * 60 * 1000;   // refresh so a watcher restart recovers
const registered = new Map();           // draft_id -> last registered at

let regState = '';
async function registerForPush(d, slot){
  if(!d || !d.draft_id) return;
  if(d.status === 'complete') return;
  const id = String(d.draft_id);
  // Key on the slot too, so changing it re-registers straight away instead of
  // waiting out the refresh interval.
  const key = id + ':' + (slot || '');
  const last = registered.get(key) || 0;
  if(Date.now() - last < REREGISTER_MS) return;
  try {
    const r = await fetch(NTFY_URL, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + NTFY_TOKEN, 'Title': 'draft-register' },
      // Same "<id>:<slot>" shape the watcher's watch file uses.
      body: slot ? `${id}:${slot}` : id
    });
    if(r.ok){ registered.set(key, Date.now()); registered.set(id, Date.now()); regState = 'watching'; }
    else regState = 'push reg failed (' + r.status + ')';
  } catch(e){ regState = 'push reg unreachable'; }
}

const LS_KEY = 'wr_manual_drafts';

function manualIds(){
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch(e){ return []; }
}
function saveManual(ids){
  try { localStorage.setItem(LS_KEY, JSON.stringify(ids.slice(-12))); } catch(e){}
}
/* Accepts a bare id or any sleeper.app URL containing one. */
function parseDraftId(s){
  const m = String(s||'').match(/(\d{15,25})/);
  return m ? m[1] : null;
}
async function addManualDraft(raw){
  const id = parseDraftId(raw);
  if(!id) return 'Could not find a draft id in that.';
  let d;
  try { d = await jget(`${API}/draft/${id}`, true); } catch(e){ return 'Sleeper does not know that draft id.'; }
  if(!d || !d.draft_id) return 'Sleeper does not know that draft id.';
  const ids = manualIds().filter(x => x !== id);
  ids.push(id);
  saveManual(ids);
  pinnedId = id;                 // pasting one in is as explicit a choice as it gets
  await findDrafts();
  active = drafts.find(x => x.draft_id === id) || active;
  try { localStorage.setItem(LAST_DRAFT_KEY, id); } catch(e){}
  await loadDraft();
  return null;
}

async function findDrafts(){
  const season = (BOARD && BOARD.season) || String(new Date().getFullYear());
  let all = [];
  try { all = await jget(`${API}/user/${userId}/drafts/nfl/${season}`, true) || []; } catch(e){ all = []; }

  // Manually-added drafts (mocks) are fetched individually and merged in.
  const known = new Set(all.map(d => String(d.draft_id)));
  const extra = await Promise.all(manualIds().map(async id => {
    if(known.has(String(id))) return null;
    try { return await jget(`${API}/draft/${id}`, true); } catch(e){ return null; }
  }));
  all = all.concat(extra.filter(Boolean));
  if(!all.length){ el('sub').textContent = 'No drafts found. Add a mock draft link below.'; return; }
  drafts = all;
  // Newest first — with several iterations of the same mock, the one you just
  // started is almost always the one you mean.
  drafts.sort((a,b) => (b.created||b.start_time||0) - (a.created||a.start_time||0));
  const live = drafts.filter(d => d.status === 'drafting');
  const pre  = drafts.filter(d => d.status === 'pre_draft');
  // A draft you explicitly picked stays picked, even if another goes live —
  // otherwise the page yanks itself away mid-draft. Auto-selection only applies
  // until you make a choice.
  const pinned = pinnedId && drafts.find(d => d.draft_id === pinnedId);
  const want = pinned
            || (active && drafts.find(d => d.draft_id === active.draft_id && d.status === 'drafting'))
            || live[0]
            || (active && drafts.find(d => d.draft_id === active.draft_id))
            || pre.sort((a,b)=>(a.start_time||0)-(b.start_time||0))[0]
            || drafts[0];
  if(!want){ el('sub').textContent = 'No drafts found on this Sleeper account.'; return; }
  if(!active || active.draft_id !== want.draft_id){
    active = want;
    try { localStorage.setItem(LAST_DRAFT_KEY, want.draft_id); } catch(e){}
    await loadDraft();
  }
}

async function loadDraft(){
  try { draftInfo = await jget(`${API}/draft/${active.draft_id}`, true); }
  catch(e){ draftInfo = active; }

  // Kept players are held out of the draft, so they must come off the board the
  // same way picks do. Use roster.keepers specifically — NOT roster.players:
  // before a draft Sleeper still shows last season's full rosters (185 players
  // in this league vs 12 actual keepers), and subtracting those would empty the
  // board of everyone worth drafting.
  unavailable = new Set();
  myRosterId = null;
  const lg = active.league_id;
  if(lg){
    try {
      const rosters = await jget(`${API}/league/${lg}/rosters`);
      (rosters||[]).forEach(r => {
        (r.keepers||[]).forEach(p => unavailable.add(String(p)));
        if(String(r.owner_id) === String(userId)) myRosterId = r.roster_id;
      });
    } catch(e){}
  }
  if(pickTimer) clearInterval(pickTimer);
  await tick();
  pickTimer = setInterval(tick, POLL_PICKS_MS);
}

document.addEventListener('visibilitychange', () => {
  // Never stop polling while a draft is live — a backgrounded tab that resumes
  // stale is worse than a few wasted requests. Only idle when nothing is running.
  if(document.hidden && draftInfo && draftInfo.status !== 'drafting'){
    if(pickTimer){ clearInterval(pickTimer); pickTimer = null; }
  } else if(!pickTimer && active){
    tick(); pickTimer = setInterval(tick, POLL_PICKS_MS);
  }
});

async function tick(){
  if(!active) return;
  try {
    const [info, ps] = await Promise.all([
      jget(`${API}/draft/${active.draft_id}`, true),
      jget(`${API}/draft/${active.draft_id}/picks`, true)
    ]);
    draftInfo = info || draftInfo;
    picks = Array.isArray(ps) ? ps : [];
  } catch(e){
    const b = el('barin');
    if(b && !b.querySelector('.err'))
      b.insertAdjacentHTML('beforeend','<span class="chip err" style="border-color:var(--red)">reconnecting…</span>');
    return;
  }
  const sig = picks.length + '|' + (draftInfo && draftInfo.status);
  render(sig !== lastSig);
  lastSig = sig;
  // Keep the server watcher pointed at whatever we're actually looking at, and
  // tell it which seat is ours — a mock usually can't resolve that on its own.
  // Only pin the slot when Sleeper genuinely can't resolve it (mocks). If it
  // can, let the server use its own answer — otherwise a default slot left over
  // from another draft would silently override the truth and alert on the wrong
  // seat. The bar already flags any disagreement.
  const cc = ctx();
  registerForPush(active, cc.detected ? null : cc.mySlot);
}

/* ---- derived state ------------------------------------------------------ */
function ctx(){
  const s = (draftInfo && draftInfo.settings) || {};
  const teams = s.teams || 12, rounds = s.rounds || 15;
  const order = (draftInfo && draftInfo.draft_order) || {};
  // Sleeper leaves draft_order null until the order is actually set (often not
  // until the draft starts), so fall back to the slot->roster mapping, which is
  // populated much earlier. Without this the page says "not in this draft" for
  // a league you're plainly in.
  let detected = order[userId] || null;
  if(!detected && myRosterId != null){
    const s2r = (draftInfo && draftInfo.slot_to_roster_id) || {};
    const hit = Object.keys(s2r).find(k => String(s2r[k]) === String(myRosterId));
    if(hit) detected = Number(hit);
  }
  // Manual slot wins. In a mock you joined, Sleeper often can't tell us which
  // seat is yours — draft_order may not name you at all — so being able to just
  // say "I'm at 3" is the difference between the page working and not.
  // A slot saved from a bigger draft would silently point at a seat that doesn't
  // exist here, so validate both the override and the fallback rather than
  // compute nonsense pick numbers.
  const valid = v => (v != null && v >= 1 && v <= teams) ? v : null;
  detected = valid(detected);
  let mySlot = (slotOverride === 'auto') ? detected : (valid(Number(slotOverride)) ?? detected);
  const orderSet = !!(order && Object.keys(order).length);
  const next = picks.length + 1;
  const total = teams * rounds;
  const done = (draftInfo && draftInfo.status === 'complete') || next > total;
  const myPicks = mySlot ? picksForSlot(mySlot, teams, rounds) : [];
  const onSlot = slotForPick(next, teams);
  const taken = new Set(picks.map(p => String(p.player_id)));
  return { s, teams, rounds, mySlot, detected, next, total, done, myPicks,
           onSlot, taken, orderSet };
}

function available(){
  const { taken } = ctx();
  return BOARD.players.filter(p => !taken.has(String(p.pid)) && !unavailable.has(String(p.pid)));
}

/* Roster slots already covered, counting keepers and everything drafted. */
function myRoster(){
  const mine = picks.filter(p => String(p.picked_by) === String(userId));
  const have = {};
  mine.forEach(p => { const pos=(p.metadata||{}).position; if(pos) have[pos]=(have[pos]||0)+1; });
  // Keepers: rostered players on my roster before the draft.
  return { mine, have };
}

/* ---- render ------------------------------------------------------------- */
function render(structural){
  const c = ctx();
  renderBar(c);
  if(structural || !el('body').dataset.built){
    renderBody(c);
    el('body').dataset.built = '1';
  } else {
    renderBody(c);
  }
}

/* The "paste mock draft link" box, backed by state rather than the DOM.
 *
 * renderBar rebuilds the whole bar's innerHTML on every tick — now every 1s —
 * so the input node itself is recreated constantly. Reading .value off "the
 * input" at submit time is a race: addManualDraft awaits several fetches, and
 * a concurrent tick can replace the node mid-await. The event handler then
 * clears a node that's no longer on the page while the freshly-rendered one
 * still shows the stale text — the exact "stuck" paste box this exists to
 * prevent. Keeping addValue/addBusy/addError as the single source of truth
 * and having every render paint from them sidesteps the race entirely: it no
 * longer matters which render call is "current" when the submit resolves.
 */
let addValue = '', addBusy = false, addError = '';

function renderBar(c){
  // Cursor position and focus still need to come from the live DOM (there's no
  // other source for them), captured just before the rebuild replaces the node.
  const prevAdd = el('dadd');
  const addHadFocus = document.activeElement === prevAdd;
  const addSelStart = prevAdd ? prevAdd.selectionStart : null;
  const addSelEnd = prevAdd ? prevAdd.selectionEnd : null;

  const bar = el('bar'), me = c.mySlot && c.onSlot === c.mySlot && !c.done;
  bar.className = 'bar' + (me ? ' you' : '');
  const st = (draftInfo && draftInfo.status) || 'pre_draft';
  const teamOf = slot => {
    const o = (draftInfo && draftInfo.draft_order) || {};
    const uid = Object.keys(o).find(k => o[k] === slot);
    return uid === userId ? 'You' : (nameOf(uid) || ('Slot ' + slot));
  };
  let h = '';
  if(c.done){
    h = `<span class="chip">Draft complete · ${picks.length} picks</span>`;
  } else {
    h = `<span class="chip ${st==='drafting'?'live':''}"><span class="dot ${st==='drafting'?'on':''}"></span>${
        st==='drafting'?'Live':'Waiting'}</span>
      <span class="chip"><b>${c.next}</b> · R${Math.ceil(c.next/c.teams)}</span>
      <span class="chip ${me?'hot':''}"><span class="onclock ${me?'me':''}">${
        me ? 'YOU ARE ON THE CLOCK' : esc(teamOf(c.onSlot))}</span></span>`;
    if(!c.mySlot) h += `<span class="chip">${c.orderSet ? 'not in this draft' : 'draft order not set yet'}</span>`;
  }
  if(drafts.length > 1)
    h += `<select id="dsel">${drafts.map(d=>`<option value="${d.draft_id}"${
      d.draft_id===active.draft_id?' selected':''}>${esc(draftLabel(d))}</option>`).join('')}</select>`;
  h += `<span class="chip" style="padding:0 0 0 7px">slot
    <select id="slotsel" style="border:0;padding:4px 6px">
      <option value="auto"${slotOverride==='auto'?' selected':''}>auto${c.detected?` (${c.detected})`:''}</option>
      ${Array.from({length:c.teams},(_,i)=>i+1).map(n=>
        `<option value="${n}"${slotOverride===n?' selected':''}>${n}</option>`).join('')}
    </select></span>`;
  // Flag a manual slot that contradicts what Sleeper reports — usually means the
  // setting is left over from a different draft.
  if(slotOverride !== 'auto' && c.detected && c.detected !== c.mySlot)
    h += `<span class="chip" style="border-color:var(--red)">Sleeper says you're at ${c.detected}</span>`;
  // Push status: "is this draft actually armed for alerts?" is the one thing you
  // can't afford to guess about on draft day.
  const armed = registered.has(String(active.draft_id));
  h += `<span class="chip" style="border-color:${armed?'var(--green)':'var(--border)'}"
     title="${armed?'Server watcher is alerting for this draft':'Not yet registered for push alerts'}">
     ${armed ? '🔔 push on' : (regState || 'push …')}</span>`;
  h += `<input id="dadd" placeholder="${esc(addError || 'paste mock draft link')}" style="width:170px"${addBusy?' disabled':''}>`;
  h += `<span class="chip" style="color:var(--muted)">${new Date().toLocaleTimeString()}</span>`;
  el('barin').innerHTML = h;
  const sel = el('dsel');
  if(sel) sel.onchange = async () => {
    pinnedId = sel.value;                       // an explicit choice sticks
    try { localStorage.setItem(LAST_DRAFT_KEY, sel.value); } catch(e){}
    active = drafts.find(d => d.draft_id === sel.value);
    await loadDraft();
  };
  const ss = el('slotsel');
  if(ss) ss.onchange = () => setSlot(ss.value);
  const add = el('dadd');
  if(add){
    add.value = addValue;      // paint from state, not from whatever the old node had
    if(addHadFocus && !addBusy){
      add.focus();
      if(addSelStart != null) add.setSelectionRange(addSelStart, addSelEnd);
    }
    add.oninput = () => { addValue = add.value; addError = ''; };   // typing clears a stale error
    add.onkeydown = async e => {
      if(e.key !== 'Enter' || addBusy) return;
      addBusy = true;
      renderBar(ctx());        // reflect "disabled" immediately, not on the next tick
      const err = await addManualDraft(addValue);
      addBusy = false;
      addError = err || '';
      addValue = '';            // clear on success AND on a bad id — nothing to keep either way
      renderBar(ctx());
      const fresh = el('dadd');
      if(fresh) fresh.focus();  // ready for the next paste right away
    };
  }
}

let USERS = {};
function nameOf(uid){ return USERS[uid]; }
async function loadUsers(){
  if(!active || !active.league_id) return;
  try {
    const us = await jget(`${API}/league/${active.league_id}/users`);
    (us||[]).forEach(u => USERS[u.user_id] = (u.metadata&&u.metadata.team_name) || u.display_name);
  } catch(e){}
}

function renderBody(c){
  const avail = available();
  const alerts = [];

  // Best available per position.
  //
  // Tier ("T1", "T2"…) is FantasyPros' own positional grouping — a single
  // source's opinion about where the real talent cliffs are. The row ORDER is
  // our 5-source blended consensus rank, which is deliberately not the same
  // thing: it's the whole reason to use this board over any one site. When
  // sources disagree about a player, his tier number and his position in this
  // list won't line up — a tier-2 guy can rank ahead of a tier-1 guy here if
  // four other sources rate him higher than FantasyPros does.
  //
  // An earlier version drew a divider every time the tier value changed, which
  // implied tiers were tidy contiguous sections of this list. They're not, and
  // presenting them that way produced exactly what it looked like: tier 1
  // appearing again after tier 2, tiers out of numeric order, etc. Tier is
  // shown inline per player now instead — still useful (a talent-cliff signal
  // from FantasyPros), just no longer implying an ordering guarantee this list
  // was never going to keep.
  const cols = POSES.map(pos => {
    const left = avail.filter(p => p.pos === pos);
    const show = left.slice(0, 7);
    const topTier = left.length && left[0].tier != null ? left[0].tier : null;
    const inTier = topTier != null ? left.filter(p => p.tier === topTier).length : 0;
    if(topTier != null && inTier > 0 && inTier <= 2 && ['QB','RB','WR','TE'].includes(pos))
      alerts.push(`${pos} tier ${topTier} down to ${inTier}`);
    const rows = show.map((p,i) => `<div class="row ${i<3?'top':''}">
        <span class="r">${pos}${p.posrank}${p.tier!=null?` <span class="tiertag">T${p.tier}</span>`:''}</span>
        <span class="nm">${esc(p.name)} <span class="sm">${esc(p.team||'')}${p.bye?'·b'+p.bye:''}</span>
          <div class="srcs">${srcLine(p)}</div></span>
        <span class="sm">#${p.rank}</span></div>`).join('');
    return `<div class="blk"><div class="blkh"><span class="n"><span class="pill ${pos}">${pos}</span></span>
      <span class="m">${left.length} left${topTier!=null?` · top T${topTier}×${inTier}`:''}</span></div>
      ${rows || '<div class="row"><span class="sm">none</span></div>'}</div>`;
  }).join('');

  el('alerts').innerHTML = alerts.slice(0,4).map(a =>
    `<div class="alert ${/down to 1$/.test(a)?'hot':''}">⚠ ${esc(a)}</div>`).join('');

  // My roster + my picks
  const { mine, have } = myRoster();
  // Flag byes only where they collide at the SAME position — two RBs both out
  // week 8 is a real lineup problem; a QB and a K sharing a bye is not.
  const byePos = {};
  mine.forEach(p => {
    const bp = BYPID.get(String(p.player_id));
    const bye = bp && bp.bye != null ? bp.bye : null;
    const pos = (p.metadata||{}).position;
    if(bye == null || !pos) return;
    const k = pos + ':' + bye;
    byePos[k] = (byePos[k]||0) + 1;
  });
  const byeClashes = Object.entries(byePos).filter(([,n]) => n >= 2)
    .map(([k]) => Number(k.split(':')[1]));
  const rp = rosterSlots(c.s);
  const pool = {...have};
  let slots = '';
  rp.forEach(s => {
    let f = false;
    if(s === 'FLEX'){ const k = ['RB','WR','TE'].find(x => (pool[x]||0)>0); if(k){pool[k]--;f=true;} }
    else if((pool[s]||0)>0){ pool[s]--; f=true; }
    slots += `<span class="slot ${f?'f':'o'}">${s}${f?' ✓':''}</span>`;
  });

  const top10 = avail.slice(0,10).map(p => `<tr>
    <td class="num">${p.rank}</td>
    <td><span class="pill ${p.pos}">${p.pos}</span> ${esc(p.name)}
      <span class="sm">${esc(p.team||'')}</span></td>
    <td class="num">${p.tier??'—'}</td>
    <td class="num">${p.adp??'—'}</td>
    <td class="num ${p.value>0?'pos':(p.value<0?'neg':'')}">${p.value!=null?(p.value>0?'+':'')+p.value:'—'}</td>
    <td class="num sm">${p.spread}</td></tr>`).join('');

  const feed = picks.slice().sort((a,b)=>b.pick_no-a.pick_no).slice(0,25).map(p => {
    const m = p.metadata||{}, isMe = String(p.picked_by)===String(userId);
    const bp = BYPID.get(String(p.player_id));
    return `<div class="row" style="${isMe?'background:rgba(232,163,61,.12)':''}">
      <span class="r">${p.round}.${String(p.pick_no).padStart(2,'0')}</span>
      <span class="nm">${esc((m.first_name||'')+' '+(m.last_name||''))}
        <span class="sm">${esc(m.position||'')} ${esc(m.team||'')}</span></span>
      <span class="sm">${bp?('#'+bp.rank):''}</span></div>`;
  }).join('');

  el('body').innerHTML = `
    <div class="lbl">Best available — top 3 highlighted</div>
    <div class="cols">${cols}</div>

    <div class="two" style="margin-top:6px">
      <div>
        <div class="lbl">Overall board</div>
        <div class="blk scroll"><table>
          <thead><tr><th class="num">#</th><th>Player</th><th class="num">Tier</th>
            <th class="num">ADP</th><th class="num">Val</th><th class="num">±</th></tr></thead>
          <tbody>${top10 || '<tr><td colspan="6" class="sm">—</td></tr>'}</tbody></table></div>
      </div>
      <div>
        <div class="lbl">Your roster${c.mySlot?` · slot ${c.mySlot}`:''}</div>
        <div>${slots || '<span class="sm">—</span>'}</div>
        <div class="lbl">Your picks${byeClashes.length?` <span class="sm" style="color:var(--red)">· ${byeClashes.length} bye clash${byeClashes.length===1?'':'es'}</span>`:''}</div>
        <div class="blk">${mine.length ? mine.sort((a,b)=>a.pick_no-b.pick_no).map(p=>{
          const m=p.metadata||{};
          const bp = BYPID.get(String(p.player_id));
          const bye = bp && bp.bye != null ? bp.bye : null;
          const clash = bye != null && byeClashes.includes(bye);
          return `<div class="row"><span class="r">${p.round}.${String(p.pick_no).padStart(2,'0')}</span>
            <span class="nm">${esc((m.first_name||'')+' '+(m.last_name||''))}
              <span class="sm">${esc(m.position||'')}</span></span>
            <span class="sm ${clash?'neg':''}">${bye!=null?'bye '+bye:'—'}</span></div>`;
        }).join('') : '<div class="row"><span class="sm">none yet</span></div>'}</div>
      </div>
    </div>

    <div class="lbl">Picks — ${picks.length}${c.total?` of ${c.total}`:''}</div>
    <div class="blk">${feed || '<div class="row"><span class="sm">no picks yet</span></div>'}</div>

    <div class="lbl">Consensus sources</div>
    <div class="blk" style="padding:8px 9px">
      <div class="sm" style="font-family:var(--mono);font-size:11px;line-height:1.7">
        ${SRC_ORDER.map(k => SOURCES[k] ? `${esc(SOURCES[k].label)} <span style="color:var(--muted)">(${
          SOURCES[k].kind}, ${SOURCES[k].n})</span>` : '').filter(Boolean).join(' &nbsp;·&nbsp; ')}
      </div>
      <div class="sm" style="margin-top:6px">Rank is the <b>median</b> of each source's ordering —
        an outlier in one source can't drag a player. <b>±</b> is the spread between the most and
        least bullish source: high means the sites genuinely disagree.</div>
    </div>`;

  el('sub').textContent = draftDesc(c);
}

function srcLine(p){
  return SRC_ORDER.map(k => {
    const v = p.srcs[k];
    return `<span title="${esc((SOURCES[k]||{}).label||k)}">${v!=null?Math.round(v):'·'}</span>`;
  }).join('/');
}

function rosterSlots(s){
  const out = [];
  const add = (n,k) => { for(let i=0;i<(s[k]||0);i++) out.push(n); };
  add('QB','slots_qb'); add('RB','slots_rb'); add('WR','slots_wr'); add('TE','slots_te');
  add('FLEX','slots_flex'); add('K','slots_k'); add('DEF','slots_def');
  if(!out.length) ['QB','RB','RB','WR','WR','TE','FLEX','K','DEF'].forEach(x=>out.push(x));
  return out;
}

function draftDesc(c){
  const d = draftInfo || {};
  const nm = (active.metadata && active.metadata.name) || (active.league_id ? 'League draft' : 'Mock draft');
  const bits = [nm, (d.type||'snake'), `${c.teams} teams`, `${c.rounds} rounds`];
  if(d.status === 'pre_draft' && active.start_time)
    bits.push('starts ' + new Date(active.start_time).toLocaleString());
  bits.push(`updated every ${POLL_PICKS_MS/1000}s`);
  if(BOARD) bits.push(`board ${new Date(BOARD.generated).toLocaleDateString()}`);
  return bits.join(' · ');
}

boot().then(loadUsers);
</script>
