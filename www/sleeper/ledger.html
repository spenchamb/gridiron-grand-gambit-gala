<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ledger · GGGG</title>
<link rel="stylesheet" href="/assets/style.css?v=25">
</head>
<body data-page="ledger">
  <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="content">
  <div class="page">

    <header>
      <div class="htext">
        <p class="eyebrow">League Activity</p>
        <h1>Ledger</h1>
        <p class="subtitle" id="subtitle">Loading&hellip;</p>
      </div>
    </header>

    <p class="updated" id="updated">&nbsp;</p>

    <div class="lg-filters" id="filters" hidden>
      <div class="lg-frow">
        <div class="lg-seg" id="typeSeg"></div>
      </div>
      <div class="lg-frow">
        <label class="lg-sel"><select id="seasonSel" aria-label="Season"></select></label>
        <label class="lg-sel"><select id="weekSel" aria-label="Week"></select></label>
        <label class="lg-sel"><select id="teamSel" aria-label="Team"></select></label>
      </div>
      <div class="lg-deadline-note" id="deadlineNote" hidden></div>
    </div>

    <div class="lg-list" id="list"></div>

    <footer><span>GGGG</span><span><a href="index.html">league</a> &middot; <a href="/index.html">home</a></span></footer>

  </div>
  </main>

<script src="/assets/app.js?v=28"></script>
<script>
let L = null;
const S = { type: 'all', season: 'all', week: 'all', team: 'all' };

const TYPE_LABEL = { trade: 'Trades', waiver: 'Waivers', free_agent: 'Free Agents', commissioner: 'Commish' };
const TYPE_ORDER = ['trade', 'waiver', 'free_agent', 'commissioner'];
const TYPE_BADGE = { trade: 'trade', waiver: 'waiver', free_agent: 'free_agent', commissioner: 'free_agent' };

const weekLabel = w => w === 0 ? 'Preseason' : 'Week ' + w;

async function init(){
  let M;
  try { [L, M] = await Promise.all([fetchJSON('data/ledger.json'), fetchJSON('data/meta.json').catch(()=>null)]); }
  catch(e){ document.getElementById('subtitle').textContent = 'Could not load transaction data.'; console.error(e); return; }

  document.getElementById('subtitle').textContent =
    `${(L.count||0).toLocaleString()} transactions · ${L.seasons.length} season${L.seasons.length===1?'':'s'}`;
  if(M) document.getElementById('updated').textContent = `Updated ${relTime(M.generated_at)}`;

  buildFilters();
  document.getElementById('filters').hidden = false;
  render();
}

function buildFilters(){
  // Type chips — only for types that actually occur.
  const tc = L.type_counts || {};
  const types = TYPE_ORDER.filter(t => tc[t]);
  document.getElementById('typeSeg').innerHTML =
    `<button class="lg-chip active" data-type="all">All<span class="n">${(L.count||0).toLocaleString()}</span></button>` +
    types.map(t => `<button class="lg-chip" data-type="${t}">${TYPE_LABEL[t]||t}<span class="n">${tc[t].toLocaleString()}</span></button>`).join('');
  document.querySelectorAll('#typeSeg .lg-chip').forEach(b => b.addEventListener('click', () => {
    S.type = b.dataset.type;
    document.querySelectorAll('#typeSeg .lg-chip').forEach(x => x.classList.toggle('active', x === b));
    render();
  }));

  // Season
  document.getElementById('seasonSel').innerHTML =
    `<option value="all">All seasons</option>` + L.seasons.map(s => `<option value="${s}">${esc(s)} season</option>`).join('');
  document.getElementById('seasonSel').addEventListener('change', e => {
    S.season = e.target.value; S.week = 'all'; buildWeekOptions(); render();
  });

  // Team (by owner_id — stable across seasons)
  document.getElementById('teamSel').innerHTML =
    `<option value="all">All teams</option>` +
    (L.managers||[]).map(m => `<option value="${esc(m.owner_id)}">${esc(m.team)}</option>`).join('');
  document.getElementById('teamSel').addEventListener('change', e => { S.team = e.target.value; render(); });

  buildWeekOptions();
  document.getElementById('weekSel').addEventListener('change', e => { S.week = e.target.value; render(); });
}

function buildWeekOptions(){
  // Weeks present for the current season selection.
  const weeks = [...new Set(L.items
    .filter(it => S.season === 'all' || it.season === S.season)
    .map(it => it.week))].sort((a,b) => b - a);
  const sel = document.getElementById('weekSel');
  sel.innerHTML = `<option value="all">All weeks</option>` +
    weeks.map(w => `<option value="${w}">${weekLabel(w)}</option>`).join('');
  sel.value = 'all';
}

function match(it){
  if(S.type !== 'all' && it.type !== S.type) return false;
  if(S.season !== 'all' && it.season !== S.season) return false;
  if(S.week !== 'all' && String(it.week) !== String(S.week)) return false;
  if(S.team !== 'all' && !(it.owner_ids||[]).includes(S.team)) return false;
  return true;
}

function dot(color){ return `<span class="lg-dot" style="background:${esc(color||'var(--muted)')}"></span>`; }

function assetHTML(a){
  if(a.kind === 'faab') return `<span class="lg-asset faab">$${a.amount} FAAB</span>`;
  if(a.kind === 'pick') return `<span class="lg-asset pick">${esc(a.label)}</span>`;
  return `<span class="lg-asset">${esc(a.name)} ${posPill(a.pos)}</span>`;
}

function tradeHTML(it){
  const sides = (it.sides||[]).map(sd => `
    <div class="lg-side">
      <div class="lg-team">${dot(sd.color)}<span>${esc(sd.team)}</span></div>
      <div class="lg-gets">${(sd.gets||[]).map(assetHTML).join('') || '<span class="muted">—</span>'}</div>
    </div>`).join('');
  return `<div class="lg-trade">
    <div class="lg-trade-head"><span>⇄ Trade</span><span>${fmtDate(it.ts)}</span></div>
    ${sides}
  </div>`;
}

function moveHTML(it){
  const parts = [];
  if(it.add)  parts.push(`<span class="lg-mv"><span class="tx-add">+ ${esc(it.add.name)}</span> ${posPill(it.add.pos)}</span>`);
  if(it.drop) parts.push(`<span class="lg-mv"><span class="tx-drop">− ${esc(it.drop.name)}</span> ${posPill(it.drop.pos)}</span>`);
  const bid = it.bid != null ? `<span class="lg-bid">$${it.bid}</span>` : '';
  return `<div class="lg-move" style="border-left-color:${esc(it.color||'var(--border)')}">
    <div class="lg-team">${dot(it.color)}<span>${esc(it.team)}</span></div>
    <div class="lg-players">${parts.join('') || '<span class="muted">—</span>'}</div>
    ${bid}
  </div>`;
}

function render(){
  const list = document.getElementById('list');
  const items = L.items.filter(match);

  // Deadline note for the selected season.
  const note = document.getElementById('deadlineNote');
  const dl = L.deadlines || {};
  if(S.season !== 'all' && dl[S.season]){
    note.hidden = false;
    note.innerHTML = `🔒 ${esc(S.season)} trade deadline — Week ${dl[S.season]}`;
  } else { note.hidden = true; }

  if(!items.length){
    list.innerHTML = `<div class="lg-empty">No transactions match these filters.</div>`;
    return;
  }

  // Group by (season, week); items already sorted newest-first so groups stay ordered.
  let html = '';
  let curKey = null;
  const dividedSeasons = new Set();
  for(const it of items){
    const key = it.season + '|' + it.week;
    if(key !== curKey){
      // Trade-deadline divider: first group in a season that falls on/before the
      // deadline week (everything below the line predates the deadline).
      const d = dl[it.season];
      if(d && !dividedSeasons.has(it.season) && it.week <= d){
        html += `<div class="lg-ddiv">🔒 Trade Deadline · Week ${d}</div>`;
        dividedSeasons.add(it.season);
      }
      html += `<div class="lg-weekhead"><span>${weekLabel(it.week)}</span><span class="c">${esc(it.season)}</span></div>`;
      curKey = key;
    }
    html += it.type === 'trade' ? tradeHTML(it) : moveHTML(it);
  }
  list.innerHTML = html;
}

init();
</script>
</body>
</html>
