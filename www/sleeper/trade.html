<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trade What-If · GGGG</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/style.css?v=21">
</head>
<body data-page="trade">
  <button class="nav-toggle" id="navToggle" aria-label="Open navigation menu">☰</button>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="content">
  <div class="page">

    <header>
      <div class="htext">
        <p class="eyebrow">Trade Lab</p>
        <h1>Trade What-If</h1>
        <p class="subtitle" id="subtitle">Draft a hypothetical trade and see how both rosters change.</p>
      </div>
    </header>

    <p class="updated" id="updated">&nbsp;</p>

    <div class="trade-controls">
      <div class="ctrl"><label for="sel-a">Team A</label><select class="sel" id="sel-a"></select></div>
      <button class="swap-btn" id="swap" aria-label="Swap the two teams" title="Swap teams">⇄</button>
      <div class="ctrl"><label for="sel-b">Team B</label><select class="sel" id="sel-b"></select></div>
      <button class="clear-btn" id="clear">Clear trade</button>
    </div>

    <section id="sec-summary" aria-live="polite">
      <div class="trade-summary" id="summary"></div>
    </section>

    <section id="sec-rosters">
      <p class="section-label">Rosters <span class="sub">— tap a player to add or remove them from the trade</span></p>
      <div class="trade-cols" id="rosters"></div>
    </section>

    <section id="sec-insights" aria-live="polite">
      <p class="section-label">Trade Analysis <span class="sub" id="basis-note"></span></p>
      <div id="insights"></div>
    </section>

    <section id="sec-result">
      <p class="section-label">Resulting Starting Lineups <span class="sub">— best legal lineup after the trade</span></p>
      <div class="impact-grid" id="result"></div>
    </section>

    <footer><span>GGGG</span><span><a href="whatif.html">what-if</a> &middot; <a href="index.html">league</a> &middot; <a href="/index.html">home</a></span></footer>

  </div>
  </main>

<script src="/assets/app.js?v=25"></script>
<script>
let DATA=null, A=null, B=null, ECR=null;
const sendA=new Set(), sendB=new Set();
const slotLabel = s => ({WRRB_FLEX:'W/R',REC_FLEX:'W/T',SUPER_FLEX:'SFLX'}[s]||s);
let SLOTS=[], FLEX={}, USE_PROJ=true;

// --- Two value lenses -------------------------------------------------------
// startVal: weekly fantasy points — decides who STARTS and the win-now lineup delta.
const startVal = p => (USE_PROJ && p.proj) ? p.proj : (p.ppg||0);
// Consensus trade value: a smooth market curve over overall consensus rank (ECR).
// #1 overall ≈ 100, decaying so scarcity at the top is respected and it's
// comparable ACROSS positions (unlike raw weekly points, which inflate QBs).
const ecrOf = pid => (ECR && ECR.players && ECR.players[String(pid)]) || null;
function cval(ecr){ return (ecr==null || !isFinite(ecr)) ? null : Math.round(1000*Math.exp(-(ecr-1)/60))/10; }
const FLOOR_VAL = 0.5;   // unranked (deep bench) players — negligible but not zero
const tradeVal = p => { const e=ecrOf(p.pid); const v=e?cval(e.ecr):null; return v==null?FLOOR_VAL:v; };
const posRankOf = p => { const e=ecrOf(p.pid); return e && e.pos_rank ? e.pos_rank : ''; };

// Optimal legal lineup from a player pool (fixed slots first, then flex) — by weekly points
function optimal(players){
  const pool=[...players].sort((x,y)=>startVal(y)-startVal(x));
  const used=new Set(), picks=SLOTS.map(()=>null);
  SLOTS.forEach((slot,i)=>{ if(FLEX[slot]) return;
    for(const p of pool){ if(used.has(p.pid)) continue; if(p.pos===slot){ picks[i]=p; used.add(p.pid); break; } }
  });
  SLOTS.forEach((slot,i)=>{ if(!FLEX[slot]) return; const elig=FLEX[slot];
    for(const p of pool){ if(used.has(p.pid)) continue; if(elig.includes(p.pos)){ picks[i]=p; used.add(p.pid); break; } }
  });
  const total=picks.reduce((s,p)=>s+(p?startVal(p):0),0);
  return {picks, total, full: picks.every(Boolean)};
}

async function init(){
  let M;
  try { [DATA, M] = await Promise.all([fetchJSON('data/trade.json'), fetchJSON('data/meta.json').catch(()=>null)]); }
  catch(e){ document.getElementById('subtitle').textContent='Could not load trade data.'; console.error(e); return; }
  try { ECR = await fetchJSON('data/ecr.json'); } catch(e){ ECR = null; }
  if(M) document.getElementById('updated').textContent = `Updated ${relTime(M.generated_at)}`;
  SLOTS=DATA.slots; FLEX=DATA.flex_map; USE_PROJ=DATA.use_projections;
  const startBasis = USE_PROJ ? `Week ${DATA.proj_week} projected points` : `last-season points/game`;
  document.getElementById('basis-note').textContent = ECR
    ? `— fairness by consensus value; lineup impact by ${startBasis}`
    : `— value basis: ${startBasis}`;

  const teams=DATA.teams;
  const opts = teams.map(t=>`<option value="${t.roster_id}">${esc(t.team)}</option>`).join('');
  const selA=document.getElementById('sel-a'), selB=document.getElementById('sel-b');
  selA.innerHTML=opts; selB.innerHTML=opts;
  // default A = user's team, B = first other
  const mine = M && teams.find(t=>t.owner_id===M.my_owner_id);
  A = mine || teams[0];
  B = teams.find(t=>t.roster_id!==A.roster_id) || teams[1];
  selA.value=A.roster_id; selB.value=B.roster_id;

  selA.addEventListener('change',()=>{ A=team(+selA.value); if(B.roster_id===A.roster_id){ B=teams.find(t=>t.roster_id!==A.roster_id); selB.value=B.roster_id; } sendA.clear(); sendB.clear(); render(); });
  selB.addEventListener('change',()=>{ B=team(+selB.value); if(A.roster_id===B.roster_id){ A=teams.find(t=>t.roster_id!==B.roster_id); selA.value=A.roster_id; } sendA.clear(); sendB.clear(); render(); });
  document.getElementById('swap').addEventListener('click',()=>{ const ta=A,sa=[...sendA]; A=B; B=ta;
    const sb=[...sendB]; sendA.clear(); sb.forEach(x=>sendA.add(x)); sendB.clear(); sa.forEach(x=>sendB.add(x));
    selA.value=A.roster_id; selB.value=B.roster_id; render(); });
  document.getElementById('clear').addEventListener('click',()=>{ sendA.clear(); sendB.clear(); render(); });
  render();
}
const team = rid => DATA.teams.find(t=>t.roster_id===rid);

function render(){
  renderRosters();
  renderSummary();
  renderInsights();
}

function renderRosters(){
  const panel=(t,sendSet)=>`
    <div class="roster-panel">
      <div class="rp-head"><span class="team-dot" style="background:${esc(t.color)}"></span>${esc(t.team)}
        <span class="rp-hint">tap to trade</span></div>
      ${t.players.map(p=>{
        const sending=sendSet.has(p.pid);
        const pr=posRankOf(p);
        return `<div class="rp-player ${sending?'sending':''}" data-pid="${p.pid}" role="button" tabindex="0" aria-pressed="${sending}">
          ${headshotHTML(p.pid,p.pos,p.nfl_team)}
          <span class="rp-name">${esc(p.name)}${injuryBadge(p.injury)}
            <span class="muted" style="font-weight:400;font-size:11px"> ${esc(pr||p.pos)}${startVal(p)?` · ${startVal(p).toFixed(1)} pts`:''}</span></span>
          ${p.starter?'<span class="rp-tag st">ST</span>':''}
          ${sending?'<span class="rp-tag out">OUT</span>':''}
          <span class="rp-val" title="Consensus value">${tradeVal(p).toFixed(1)}</span>
        </div>`;
      }).join('')}
    </div>`;
  const el=document.getElementById('rosters');
  el.innerHTML = panel(A,sendA) + panel(B,sendB);
  el.querySelectorAll('#rosters .roster-panel:first-child .rp-player').forEach(r=>bindRow(r,sendA));
  el.querySelectorAll('#rosters .roster-panel:last-child .rp-player').forEach(r=>bindRow(r,sendB));
}
function bindRow(row,set){
  const toggle=()=>{ const pid=row.dataset.pid; set.has(pid)?set.delete(pid):set.add(pid); render(); };
  row.addEventListener('click',toggle);
  row.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
}

function chips(team,set,sideClass){
  const arr=team.players.filter(p=>set.has(p.pid));
  if(!arr.length) return `<div class="ts-empty">No players yet</div>`;
  return `<div class="ts-side ${sideClass}">`+arr.map(p=>
    `<span class="trade-chip" data-pid="${p.pid}" data-side="${sideClass}">${esc(p.name)} <span class="x">✕</span></span>`).join('')+`</div>`;
}
function renderSummary(){
  const el=document.getElementById('summary');
  el.innerHTML = `
    <div class="ts-col"><div class="ts-label">${esc(A.team)} sends</div>${chips(A,sendA,'left')}</div>
    <div class="ts-arrow">⇄</div>
    <div class="ts-col right"><div class="ts-label">${esc(B.team)} sends</div>${chips(B,sendB,'right')}</div>`;
  el.querySelectorAll('.trade-chip').forEach(c=>c.addEventListener('click',()=>{
    const set=c.dataset.side==='left'?sendA:sendB; set.delete(c.dataset.pid); render();
  }));
}

function rosterAfter(team, sendSet, incoming){
  const kept=team.players.filter(p=>!sendSet.has(p.pid));
  return kept.concat(incoming);
}
function posCounts(players){ const c={}; players.forEach(p=>c[p.pos]=(c[p.pos]||0)+1); return c; }
function delta(n){ const s=n>0?'+':''; const cls=n>0?'delta-pos':n<0?'delta-neg':'delta-flat'; return `<span class="${cls}">${s}${n.toFixed(1)}</span>`; }

function renderInsights(){
  const inEl=document.getElementById('insights'), resEl=document.getElementById('result');
  if(!sendA.size && !sendB.size){
    inEl.innerHTML=`<div class="wi-note">Tap players on each side to draft a trade. You'll get a <strong>consensus value</strong> fairness read (a cross-position market curve from expert rankings) plus each team's <strong>win-now lineup</strong> change and roster balance.</div>`;
    resEl.innerHTML=''; document.getElementById('sec-result').style.display='none';
    return;
  }
  document.getElementById('sec-result').style.display='';
  const inA=B.players.filter(p=>sendB.has(p.pid));   // A receives what B sends
  const inB=A.players.filter(p=>sendA.has(p.pid));
  const aAfter=rosterAfter(A,sendA,inA), bAfter=rosterAfter(B,sendB,inB);

  const optAb=optimal(A.players).total, optAa=optimal(aAfter).total;
  const optBb=optimal(B.players).total, optBa=optimal(bAfter).total;
  // Fairness lens: consensus market value each side receives
  const valA=inA.reduce((s,p)=>s+tradeVal(p),0);   // consensus value A receives
  const valB=inB.reduce((s,p)=>s+tradeVal(p),0);   // consensus value B receives
  const totV=valA+valB || 1;
  const pctA=Math.round(valA/totV*100);
  const balance=100-Math.abs(pctA-50)*2;

  // Fairness verdict from consensus value (neutral, factual)
  const diff=valA-valB, adiff=Math.abs(diff);
  const favTeam = diff>0 ? A : B;
  let verdict;
  if(!ECR) verdict = `Consensus value unavailable — showing lineup impact only.`;
  else if(adiff < 3) verdict = `<strong>Even by consensus value</strong> — within ${adiff.toFixed(1)} pts.`;
  else verdict = `Consensus value favors <strong style="color:${esc(favTeam.color)}">${esc(favTeam.team)}</strong> by ${adiff.toFixed(1)} pts (${Math.max(pctA,100-pctA)}% / ${Math.min(pctA,100-pctA)}%).`;

  const lineLine = `Win-now starting lineup: ${A.team} ${delta(optAa-optAb)}, ${B.team} ${delta(optBa-optBb)} projected pts/wk.`;
  inEl.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="ts-label">Consensus value balance</div>
      <div class="balance-track">
        <div class="balance-seg" style="width:${pctA}%;background:${esc(A.color)}"></div>
        <div class="balance-seg" style="width:${100-pctA}%;background:${esc(B.color)}"></div>
      </div>
      <div class="balance-foot"><span>${esc(A.team)} gets ${valA.toFixed(1)} (${pctA}%)</span>
        <span>${balance}% even</span>
        <span>${esc(B.team)} gets ${valB.toFixed(1)} (${100-pctA}%)</span></div>
      <p style="margin-top:12px;font-size:14px;color:var(--text)">${verdict}</p>
      <p style="margin-top:4px;font-size:13px;color:var(--muted)">${lineLine}</p>
    </div>
    <div class="impact-grid">
      ${teamImpact(A,inB,inA,optAb,optAa,aAfter,valB,valA)}
      ${teamImpact(B,inA,inB,optBb,optBa,bAfter,valA,valB)}
    </div>`;

  resEl.innerHTML = resultLineup(A,aAfter)+resultLineup(B,bAfter);
}

function teamImpact(t,out,inc,optB,optA,after,valOut,valIn){
  const before=posCounts(t.players), aft=posCounts(after);
  const poss=['QB','RB','WR','TE','K','DEF'];
  const posLine=poss.filter(p=>(before[p]||0)||(aft[p]||0)).map(p=>{
    const d=(aft[p]||0)-(before[p]||0);
    return `${p} ${aft[p]||0}${d?` <span class="${d>0?'delta-pos':'delta-neg'}">(${d>0?'+':''}${d})</span>`:''}`;
  }).join(' · ');
  const opt=optimal(after);
  const warn = !opt.full ? `<div class="warn">⚠ Can't fill every starting slot after this trade.</div>`
    : (aft.RB||0)<2 ? `<div class="warn">⚠ Thin at RB (${aft.RB||0}).</div>`
    : (aft.WR||0)<2 ? `<div class="warn">⚠ Thin at WR (${aft.WR||0}).</div>` : '';
  const netV = (valIn||0)-(valOut||0);
  return `<div class="record-card">
    <div class="rlabel" style="color:${esc(t.color)}">${esc(t.team)}</div>
    <div style="font-size:13px;color:var(--muted);margin:6px 0">Gives ${out.length} · Gets ${inc.length}</div>
    ${ECR?`<div style="font-size:14px;margin-bottom:6px">Consensus value ${delta(netV)} <span class="muted" style="font-size:12px">(+${(valIn||0).toFixed(1)} / −${(valOut||0).toFixed(1)})</span></div>`:''}
    <div style="font-size:14px;margin-bottom:8px">Best lineup ${optB.toFixed(1)} → <strong>${optA.toFixed(1)}</strong> ${delta(optA-optB)}</div>
    <div style="font-size:12px;color:var(--muted)">${posLine}</div>
    ${warn}</div>`;
}

function resultLineup(t,after){
  const opt=optimal(after);
  const rows=SLOTS.map((slot,i)=>{
    const p=opt.picks[i];
    return `<div class="lineup-row ${p?'':'empty'}">
      <span class="slot-badge start">${esc(slotLabel(slot))}</span>
      ${p?`${headshotHTML(p.pid,p.pos,p.nfl_team)}<span class="lp-name">${esc(p.name)} <span class="muted" style="font-weight:400">${esc(p.pos)}·${esc(p.nfl_team)}</span></span><span class="lp-val">${startVal(p).toFixed(1)}</span>`
        :'<span class="lp-name muted">— empty —</span>'}</div>`;
  }).join('');
  const bench=after.filter(p=>!opt.picks.includes(p)).sort((x,y)=>startVal(y)-startVal(x));
  return `<div><div class="rp-head"><span class="team-dot" style="background:${esc(t.color)}"></span>${esc(t.team)}</div>
    <div class="lineup">${rows}</div>
    <div class="lineup-total"><span class="muted">Projected total</span><strong>${opt.total.toFixed(1)}</strong></div>
    <div class="bs-bench" style="margin-top:10px"><strong>Bench:</strong> ${bench.map(p=>esc(p.name)).join(' · ')||'—'}</div></div>`;
}

init();
</script>
</body>
</html>
