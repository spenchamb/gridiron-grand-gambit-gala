<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Last Week · GGGG</title>
<link rel="stylesheet" href="/assets/style.css?v=20">
</head>
<body data-page="recap">
  <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="content">
  <div class="page">

    <header>
      <div class="htext">
        <p class="eyebrow" id="eyebrow">Weekly Recap</p>
        <h1 id="title">Last Week</h1>
        <p class="subtitle" id="subtitle">Loading&hellip;</p>
      </div>
    </header>

    <p class="updated" id="updated">&nbsp;</p>

    <div id="empty" style="display:none"></div>

    <section id="sec-hero">
      <div class="records-grid" id="hero-grid"></div>
    </section>

    <section id="sec-luck">
      <p class="section-label">Luck of the Week</p>
      <div class="stat-grid" id="luck-grid"></div>
    </section>

    <section id="sec-scores">
      <p class="section-label">Scoreboard</p>
      <div class="score-grid" id="scores-grid"></div>
    </section>

    <section id="sec-players">
      <p class="section-label">Top Performers <span class="sub">— best fantasy starters this week</span></p>
      <div class="card table-wrap"><table id="players-table"><tbody></tbody></table></div>
    </section>

    <footer><span>GGGG</span><span><a href="index.html">league</a> &middot; <a href="/index.html">home</a></span></footer>

  </div>
  </main>

<script src="/assets/app.js?v=24"></script>
<script>
function toggleSections(show){
  ['sec-hero','sec-luck','sec-scores','sec-players'].forEach(id=>{
    document.getElementById(id).style.display = show ? '' : 'none';
  });
}

async function init(){
  let R, M;
  try { [R, M] = await Promise.all([fetchJSON('data/recap.json'), fetchJSON('data/meta.json')]); }
  catch(e){ document.getElementById('subtitle').textContent='Could not load recap.'; console.error(e); return; }
  if(M) document.getElementById('updated').textContent = `Updated ${relTime(M.generated_at)}`;

  const live = M && M.is_live;
  if(!R || !R.has_data){
    toggleSections(false);
    document.getElementById('subtitle').textContent = live
      ? 'No games have been played yet this season — check back after Week 1.'
      : 'No completed week to recap yet.';
    const e=document.getElementById('empty'); e.style.display='';
    e.innerHTML = `<div class="wi-note">The new season hasn't kicked off. Once Week 1 is in the books, this page fills with the week's biggest scores, closest games, lucky/unlucky teams, and top performers.</div>`;
    return;
  }
  toggleSections(true);

  const phase = R.is_regular ? `Week ${R.week}` : `Playoffs · Week ${R.week}`;
  document.getElementById('eyebrow').textContent = live ? `${R.season} · In Progress` : `${R.season} · ${R.is_regular?'Regular Season':'Final Week'}`;
  document.getElementById('title').textContent = live ? `${phase} Recap` : (R.is_regular?`Week ${R.week} Recap`:`Championship Week`);
  const decided = R.games.length;
  document.getElementById('subtitle').textContent =
    `${decided} matchup${decided>1?'s':''} · league median ${R.median.toFixed(1)} · high ${R.high.pts.toFixed(1)}, low ${R.low.pts.toFixed(1)}`;

  // Hero record cards
  const hero = [];
  hero.push(['Top Score', R.high.pts.toFixed(1), R.high.team]);
  hero.push(['Low Score', R.low.pts.toFixed(1), R.low.team]);
  if(R.blowout) hero.push(['Biggest Blowout', `+${R.blowout.margin.toFixed(1)}`, `${R.blowout.winner||R.blowout.t1} over ${R.blowout.winner===R.blowout.t1?R.blowout.t2:R.blowout.t1}`]);
  if(R.nailbiter) hero.push(['Closest Game', R.nailbiter.margin.toFixed(2), `${R.nailbiter.winner} by a hair`]);
  document.getElementById('hero-grid').innerHTML = hero.map(([l,v,s])=>
    `<div class="record-card"><div class="rlabel">${esc(l)}</div><div class="rval">${esc(v)}</div><div class="rsub">${esc(s)}</div></div>`).join('');

  // Luck
  const luck = [];
  if(R.unlucky) luck.push(['Unlucky', R.unlucky.pts.toFixed(1), `${R.unlucky.team} — most points in a loss`]);
  if(R.lucky) luck.push(['Lucky', R.lucky.pts.toFixed(1), `${R.lucky.team} — fewest points in a win`]);
  luck.push(['Beat the Median', `${R.above_median.length}/${R.games.length*2}`, `scored above ${R.median.toFixed(1)}`]);
  document.getElementById('luck-grid').innerHTML = luck.map(([l,v,s])=>
    `<div class="stat-card"><div class="stat-label">${esc(l)}</div><div class="stat-value">${esc(v)}</div><div class="stat-sub">${esc(s)}</div></div>`).join('');

  // Scoreboard
  document.getElementById('scores-grid').innerHTML = R.games.map(g=>{
    const t1w=g.winner===g.t1, t2w=g.winner===g.t2;
    return `<div class="score-card">
      <div class="score-row ${t1w?'win':'lose'}"><span>${esc(g.t1)}</span><span class="pts">${g.t1_pts.toFixed(1)}</span></div>
      <div class="score-row ${t2w?'win':'lose'}"><span>${esc(g.t2)}</span><span class="pts">${g.t2_pts.toFixed(1)}</span></div>
      <div class="muted" style="font-size:11px;text-align:right;margin-top:4px">${g.winner?`margin ${g.margin.toFixed(1)}`:'tie'} · total ${g.total.toFixed(1)}</div>
    </div>`;
  }).join('');

  // Top performers
  document.getElementById('players-table').innerHTML =
    `<thead><tr><th class="rank-cell">#</th><th>Player</th><th>Started By</th><th class="num">Pts</th></tr></thead><tbody>` +
    R.top_players.map((p,i)=>`<tr>
      <td class="rank-cell">${i+1}</td>
      <td><div class="player-cell">${headshotHTML(p.pid,p.pos,p.nfl_team)}
        <div class="pmeta"><div class="pname">${esc(p.player)}</div>
          <div class="psub">${esc(p.pos)} · ${esc(p.nfl_team)}</div></div></div></td>
      <td class="muted">${esc(p.fantasy_team)}</td>
      <td class="num"><strong>${p.pts.toFixed(1)}</strong></td></tr>`).join('') + '</tbody>';
}
init();
</script>
</body>
</html>
