<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Waiver Wire · GGGG</title>
<link rel="stylesheet" href="/assets/style.css?v=31">
</head>
<body data-page="waivers">
  <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="content">
  <div class="page">

    <header>
      <div class="htext">
        <p class="eyebrow" id="eyebrow">Free Agency</p>
        <h1>Waiver Wire</h1>
        <p class="subtitle" id="subtitle">Loading&hellip;</p>
      </div>
    </header>

    <p class="updated" id="updated">&nbsp;</p>

    <section id="sec-order">
      <p class="section-label" id="order-label">Waiver Order</p>
      <div class="card table-wrap"><table id="order-table"><tbody></tbody></table></div>
    </section>

    <section id="sec-trending">
      <p class="section-label">Trending <span class="sub">— most added &amp; dropped across Sleeper (24h)</span></p>
      <div class="two-col">
        <div><p class="season-tag" style="margin-top:0">🔼 Most Added</p><div class="tx-list" id="trend-add"></div></div>
        <div><p class="season-tag" style="margin-top:0">🔽 Most Dropped</p><div class="tx-list" id="trend-drop"></div></div>
      </div>
    </section>

    <section id="sec-available">
      <p class="section-label">Best Available <span class="sub" id="avail-sub">— top unrostered by consensus</span></p>
      <div class="wi-tabs" id="pos-tabs"></div>
      <div class="card table-wrap"><table id="avail-table"><tbody></tbody></table></div>
    </section>

    <section id="sec-moves">
      <p class="section-label">Recent Pickups &amp; Drops</p>
      <div class="tx-list" id="moves-list"></div>
    </section>

    <footer><span>GGGG</span><span><a href="index.html">league</a> &middot; <a href="/index.html">home</a></span></footer>

  </div>
  </main>

<script src="/assets/app.js?v=32"></script>
<script>
let W = null, ECR = null, PPG = {};

async function init(){
  let M;
  try { [W, M] = await Promise.all([fetchJSON('data/waivers.json'), fetchJSON('data/meta.json')]); }
  catch(e){ document.getElementById('subtitle').textContent='Could not load waiver data.'; console.error(e); return; }
  // ECR is optional — page still works if ffpros hasn't run yet.
  try { ECR = await fetchJSON('data/ecr.json'); } catch(e){ ECR = null; }
  // last-season PPG lookup by pid, from the Sleeper best-available lists (secondary signal)
  const seed = arr => (arr||[]).forEach(a => { if(a.pid!=null) PPG[a.pid] = a; });
  seed(W.best_overall); Object.values(W.best_available||{}).forEach(seed);
  if(M) document.getElementById('updated').textContent = `Updated ${relTime(M.generated_at)}`;

  const mode = W.is_faab ? `FAAB · $${W.budget} budget` : 'Reverse-standings priority';
  document.getElementById('subtitle').textContent = `${W.season} · ${mode}`;
  document.getElementById('eyebrow').textContent = `Free Agency · ${W.season}`;

  // Waiver order
  document.getElementById('order-label').textContent = W.is_faab ? 'FAAB Budgets' : 'Waiver Priority';
  const orderRows = W.order.map(o => {
    const dot = `<span class="team-dot" style="background:${esc(o.color||'var(--muted)')}"></span>`;
    if(W.is_faab){
      const pct = o.faab_total ? Math.round(o.faab_left/o.faab_total*100) : 0;
      return `<tr><td><div class="team-cell">${dot}<span class="team-name">${esc(o.team)}</span></div></td>
        <td class="num">$${o.faab_left}<span class="muted"> / ${o.faab_total}</span></td>
        <td><span class="faab-bar"><span class="faab-fill" style="width:${pct}%;background:${esc(o.color||'var(--green)')}"></span></span></td></tr>`;
    }
    return `<tr><td class="rank-cell">${o.position||''}</td>
      <td><div class="team-cell">${dot}<span class="team-name">${esc(o.team)}</span></div>
        <div class="muted" style="font-size:12px;padding-left:20px">${esc(o.owner)}</div></td></tr>`;
  }).join('');
  document.getElementById('order-table').innerHTML = W.is_faab
    ? `<thead><tr><th>Team</th><th class="num">Remaining</th><th></th></tr></thead><tbody>${orderRows}</tbody>`
    : `<thead><tr><th class="rank-cell">#</th><th>Team</th></tr></thead><tbody>${orderRows}</tbody>`;

  // Trending
  const trendRow = t => `<div class="tx-item">
    ${headshotHTML(t.pid, t.pos, t.nfl_team)}
    <div class="tx-body"><div><strong>${esc(t.player)}</strong>${injuryBadge(t.injury)}
      <span class="muted"> ${esc(t.pos)} · ${esc(t.nfl_team)}</span></div>
      <div class="tx-date">${(t.count||0).toLocaleString()} moves · ${t.rostered_by?('rostered by '+esc(t.rostered_by)):'<span class="tx-add">available</span>'}</div></div></div>`;
  document.getElementById('trend-add').innerHTML = W.trending_add.map(trendRow).join('') || '<p class="muted">—</p>';
  document.getElementById('trend-drop').innerHTML = W.trending_drop.map(trendRow).join('') || '<p class="muted">—</p>';

  // Best available — position tabs
  const positions = ['ALL','QB','RB','WR','TE','K','DEF'];
  document.getElementById('pos-tabs').innerHTML = positions.map((p,i)=>
    `<button class="wi-tab ${i===0?'active':''}" data-pos="${p}">${p}</button>`).join('');
  document.querySelectorAll('#pos-tabs .wi-tab').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#pos-tabs .wi-tab').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); renderAvail(b.dataset.pos);
  }));
  renderAvail('ALL');

  // Recent moves
  document.getElementById('moves-list').innerHTML = W.recent_moves.map(t=>{
    const badge=`<span class="tx-badge tx-${t.type}">${t.type==='free_agent'?'FA':t.type}</span>`;
    const body = `<div>${esc(t.team)} <span class="tx-add">+ ${esc(t.add)}</span>
      <span class="muted">(${esc(t.add_pos)}${t.add_team?' · '+esc(t.add_team):''})</span>
      ${t.drop?`<span class="tx-drop"> − ${esc(t.drop)}</span>`:''}</div>`;
    return `<div class="tx-item">${badge}<div class="tx-body">${body}<div class="tx-date">${fmtDate(t.created)}</div></div></div>`;
  }).join('') || '<p class="muted">No recent moves.</p>';
}

function renderAvail(pos){
  // Prefer consensus ordering; fall back to Sleeper season-PPR lists if consensus is unavailable.
  const sub = document.getElementById('avail-sub');
  const useECR = ECR && ECR.available && (ECR.available[pos] && ECR.available[pos].length);
  if(useECR){
    const modeLabel = ECR.mode==='ros' ? 'rest-of-season' : 'preseason';
    sub.textContent = `— top unrostered by ${modeLabel} consensus (PPR)`;
    const list = ECR.available[pos] || [];
    document.getElementById('avail-table').innerHTML =
      `<thead><tr><th class="rank-cell">#</th><th>Player</th><th>Pos</th><th class="num">ECR</th><th class="num">Pos</th><th class="num">Ros%</th><th class="num">PPG</th></tr></thead><tbody>` +
      list.map((a,i)=>{
        const seedRow = PPG[a.pid];
        const ppg = seedRow ? (seedRow.ppg||0).toFixed(1) : '<span class="muted">—</span>';
        const nflTeam = a.team && a.team!=='FA' ? a.team : (seedRow?seedRow.nfl_team:'');
        return `<tr><td class="rank-cell">${i+1}</td>
          <td><div class="player-cell">${headshotHTML(a.pid,a.pos,nflTeam)}
            <div class="pmeta"><div class="pname">${esc(a.name)}${injuryBadge(a.injury)}</div>
              <div class="psub">${esc(nflTeam||'')}</div></div></div></td>
          <td>${posPill(a.pos)}</td>
          <td class="num"><strong>${a.ecr!=null?a.ecr:'—'}</strong></td>
          <td class="num muted">${esc(a.pos_rank||'')}</td>
          <td class="num muted">${a.owned!=null?Math.round(a.owned)+'%':'—'}</td>
          <td class="num muted">${ppg}</td></tr>`;
      }).join('') + '</tbody>';
    return;
  }
  // Fallback: original Sleeper season-PPR ordering
  sub.textContent = '— top unrostered scorers by position (season PPR)';
  const list = pos==='ALL' ? W.best_overall : (W.best_available[pos]||[]);
  document.getElementById('avail-table').innerHTML =
    `<thead><tr><th class="rank-cell">#</th><th>Player</th><th>Pos</th><th class="num">Season PPR</th><th class="num">PPG</th></tr></thead><tbody>` +
    list.map((a,i)=>`<tr><td class="rank-cell">${i+1}</td>
      <td><div class="player-cell">${headshotHTML(a.pid,a.pos,a.nfl_team)}
        <div class="pmeta"><div class="pname">${esc(a.player)}${injuryBadge(a.injury)}</div>
          <div class="psub">${esc(a.nfl_team)}</div></div></div></td>
      <td>${posPill(a.pos)}</td>
      <td class="num"><strong>${(a.pts_ppr||0).toFixed(1)}</strong></td>
      <td class="num muted">${(a.ppg||0).toFixed(1)}</td></tr>`).join('') + '</tbody>'
    || '<tbody><tr><td class="muted">None.</td></tr></tbody>';
}
init();
</script>
</body>
</html>
