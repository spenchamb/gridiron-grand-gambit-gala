<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Draft Day · GGGG</title>
<link rel="stylesheet" href="/assets/style.css?v=30">
<style>
/* Inline for the same reason as predraft.html: HTML is served no-cache, so these
   ship immediately without a ?v= bump on the shared stylesheet. */
.dd-bar { position:sticky; top:0; z-index:30; background:var(--bg,#1a120c);
  border-bottom:2px solid var(--border,#3d2c1f); padding:8px 0 10px; margin-bottom:14px; }
body.has-mtop .dd-bar { top:48px; }
.dd-status { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.dd-chip { border:2px solid var(--border,#3d2c1f); background:var(--surface,#221812);
  padding:5px 9px; font-size:12px; font-family:var(--font-mono,inherit); }
.dd-chip b { color:var(--accent,#e8a33d); font-size:14px; }
.dd-chip.live { border-color:var(--green,#5aa469); }
.dd-chip.mine { border-color:var(--accent,#e8a33d); background:rgba(232,163,61,.15); }
.dd-onclock { font-size:15px; font-weight:700; }
.dd-onclock.you { color:var(--accent,#e8a33d); }
.dd-dot { display:inline-block; width:8px; height:8px; border-radius:50%;
  background:var(--muted,#9b8579); margin-right:5px; vertical-align:middle; }
.dd-dot.on { background:var(--green,#5aa469); animation:ddpulse 2s infinite; }
@keyframes ddpulse { 0%,100%{opacity:1} 50%{opacity:.35} }

.av-cols { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); }
.av-block { border:2px solid var(--border,#3d2c1f); background:var(--surface,#221812); }
.av-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  padding:5px 9px; background:var(--surface2,#2c1f16); border-bottom:2px solid var(--border,#3d2c1f); }
.av-head .an { font-size:12px; font-weight:700; letter-spacing:.06em; }
.av-head .am { font-size:11px; color:var(--muted,#9b8579); font-family:var(--font-mono,inherit); }
.av-row { display:flex; align-items:center; gap:7px; padding:4px 9px; font-size:13px;
  border-bottom:1px solid rgba(255,255,255,.05); }
.av-row:last-child { border-bottom:0; }
.av-row .ar { font-family:var(--font-mono,inherit); font-size:11px; color:var(--muted,#9b8579); min-width:36px; }
.av-row .an2 { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.av-row .aa { font-family:var(--font-mono,inherit); font-size:11px; color:var(--muted,#9b8579); }
.av-row.steal { background:rgba(90,164,105,.12); }
.tierline { padding:3px 9px; font-size:11px; font-family:var(--font-mono,inherit);
  color:var(--amber,#e8a33d); background:rgba(232,163,61,.08);
  border-bottom:1px solid rgba(255,255,255,.05); }

.feed { display:flex; flex-direction:column; }
.feed-row { display:flex; align-items:center; gap:8px; padding:6px 9px; font-size:13px;
  border-bottom:1px solid rgba(255,255,255,.06); }
.feed-row:last-child { border-bottom:0; }
.feed-row .fno { font-family:var(--font-mono,inherit); font-size:11px; color:var(--muted,#9b8579); min-width:42px; }
.feed-row .fn { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.feed-row.mine { background:rgba(232,163,61,.12); }

.myslot { display:inline-block; border:2px solid var(--border,#3d2c1f); padding:3px 7px;
  font-size:12px; margin:0 5px 5px 0; font-family:var(--font-mono,inherit); }
.myslot.filled { border-color:var(--green,#5aa469); color:var(--green,#5aa469); }
.myslot.open { border-color:var(--amber,#e8a33d); color:var(--amber,#e8a33d); }
.alert { border:2px solid var(--amber,#e8a33d); background:rgba(232,163,61,.1);
  padding:8px 10px; font-size:13px; margin-bottom:8px; }
.alert.hot { border-color:var(--red,#c8503c); background:rgba(200,80,60,.12); }
@media (max-width:520px){ .av-cols { grid-template-columns:1fr; } }
</style>
</head>
<body data-page="draftday">
  <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="content">
  <div class="page">

    <header>
      <div class="htext">
        <p class="eyebrow" id="eyebrow">Draft Day</p>
        <h1 id="title">Draft Day</h1>
        <p class="subtitle" id="subtitle">Loading&hellip;</p>
      </div>
    </header>

    <div class="dd-bar">
      <div class="dd-status" id="dd-status"></div>
    </div>

    <div id="alerts"></div>

    <section id="sec-avail">
      <p class="section-label">Best Available <span class="sub" id="avail-sub">— consensus rank, minus everyone already gone</span></p>
      <div class="av-cols" id="avail-cols"></div>
    </section>

    <section id="sec-me">
      <p class="section-label">Your Roster <span class="sub" id="me-sub"></span></p>
      <div id="me-slots"></div>
      <div class="card feed" id="me-picks" style="margin-top:10px"></div>
    </section>

    <section id="sec-feed">
      <p class="section-label">Picks <span class="sub" id="feed-sub">— most recent first</span></p>
      <div class="card feed" id="feed"></div>
    </section>

    <footer><span>GGGG</span><span><a href="predraft.html">draft prep</a> &middot; <a href="index.html">league</a></span></footer>

  </div>
  </main>

<script src="/assets/app.js?v=32"></script>
<script>
/* Draft Day — live companion, refreshed straight from the Sleeper draft API.
 *
 * ARCHITECTURE EXCEPTION (deliberate, see CLAUDE.md §2): every other page in this
 * app reads only the JSON the builders produce, and the front end never calls
 * Sleeper. That rule can't hold here — the builder cron is 5-minutely at best,
 * which is useless while picks are landing every 90 seconds. So this one page
 * polls Sleeper directly.
 *
 * It's a safe exception: the endpoints are public, read-only and need no key,
 * and api.sleeper.app sends `access-control-allow-origin: *` so the browser can
 * reach it without a proxy. Sleeper puts a 30s CDN cache in front of the picks
 * endpoint (`cache-control: public, s-maxage=30`), so polling faster than that
 * buys nothing — 15s is the floor worth using, and at 4 requests/minute we're
 * nowhere near their ~1000/min guidance.
 *
 * Rankings still come from data/ecr.json like everywhere else. */

const SLEEPER = 'https://api.sleeper.app/v1';
const POLL_MS = 15000;
const POSES = ['QB','RB','WR','TE','K','DEF'];

let E = null, P = null, KEPT = new Set(), ME = null, MYPICKS = [], DRAFT = null;
let TEAMS = 12, ROUNDS = 14, SLOT = null, OWNERS = {}, SLOT_OWNER = {};
let picks = [], timer = null, lastCount = -1;

const plink = (pid, txt) => `<a href="player.html?pid=${encodeURIComponent(pid)}">${txt}</a>`;

function snakePicks(slot, teams, rounds){
  const out = [];
  for(let r=1; r<=rounds; r++){
    const inRound = (r % 2 === 1) ? slot : (teams - slot + 1);
    out.push({ round:r, overall:(r-1)*teams + inRound });
  }
  return out;
}
/* Inverse: which slot is on the clock for a given overall pick. */
function slotForPick(overall, teams){
  const r = Math.ceil(overall / teams);
  const i = overall - (r-1)*teams;
  return (r % 2 === 1) ? i : (teams - i + 1);
}

async function jget(url){
  const r = await fetch(url, { cache:'no-store' });
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

async function init(){
  try { E = await fetchJSON('data/ecr.json'); }
  catch(e){
    document.getElementById('subtitle').textContent =
      'Consensus rankings unavailable — the board needs data/ecr.json.';
    return;
  }
  try { P = await fetchJSON('data/preseason.json'); } catch(e){ P = null; }
  let M = null;
  try { M = await fetchJSON('data/meta.json'); } catch(e){}

  const kl = (P && P.keepers) || [];
  KEPT = new Set(kl.map(k => String(k.pid)));
  kl.forEach(k => { OWNERS[String(k.owner_id)] = k.team; SLOT_OWNER[k.draft_slot] = k.team; });

  const d = (P && P.draft) || {};
  DRAFT = d.draft_id;
  TEAMS = (P && P.settings && P.settings.total_rosters) || 12;
  ROUNDS = d.rounds || 14;

  const qOwner = new URLSearchParams(location.search).get('owner');
  const myOwner = qOwner || (M && M.my_owner_id) || '';
  ME = kl.find(k => String(k.owner_id) === String(myOwner)) || null;
  SLOT = ME ? ME.draft_slot : null;
  MYPICKS = SLOT ? snakePicks(SLOT, TEAMS, ROUNDS) : [];

  document.getElementById('title').textContent = `${(P&&P.season)||E.season||''} Draft Day`;
  document.getElementById('me-sub').textContent = ME ? `— ${ME.team} · slot ${SLOT}` : '— team unknown';

  if(!DRAFT){
    document.getElementById('subtitle').textContent = 'No draft has been scheduled yet.';
    return;
  }
  await refresh();
  timer = setInterval(refresh, POLL_MS);
  // Don't hammer Sleeper while the tab is in the background on someone's phone.
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ clearInterval(timer); timer = null; }
    else if(!timer){ refresh(); timer = setInterval(refresh, POLL_MS); }
  });
}

async function refresh(){
  let info = null;
  try {
    [info, picks] = await Promise.all([
      jget(`${SLEEPER}/draft/${DRAFT}`),
      jget(`${SLEEPER}/draft/${DRAFT}/picks`)
    ]);
  } catch(e){
    document.getElementById('subtitle').textContent =
      'Could not reach Sleeper — retrying. Rankings below are still current.';
    return;
  }
  picks = Array.isArray(picks) ? picks : [];
  const status = (info && info.status) || 'pre_draft';
  document.getElementById('subtitle').textContent =
    `${status === 'drafting' ? 'Live' : status === 'complete' ? 'Complete' : 'Not started'}`
    + ` · ${ROUNDS} rounds · ${TEAMS} teams · updated ${new Date().toLocaleTimeString()}`;

  if(picks.length !== lastCount){ lastCount = picks.length; render(status); }
  else renderStatus(status);          // clock/countdown still moves between picks
  if(status === 'complete' && timer){ clearInterval(timer); timer = null; }
}

function state(){
  const taken = new Set(picks.map(p => String(p.player_id)));
  const next = picks.length + 1;
  const myNext = MYPICKS.find(p => p.overall >= next) || null;
  const until = myNext ? myNext.overall - next : null;
  return { taken, next, myNext, until };
}

function renderStatus(status){
  const { next, myNext, until } = state();
  const onClock = slotForPick(next, TEAMS);
  const onTeam = SLOT_OWNER[onClock] || `Slot ${onClock}`;
  const isMe = SLOT && onClock === SLOT;
  const done = status === 'complete' || next > TEAMS * ROUNDS;

  document.getElementById('dd-status').innerHTML = done
    ? `<span class="dd-chip">Draft complete · ${picks.length} picks</span>`
    : `<span class="dd-chip ${status==='drafting'?'live':''}">
         <span class="dd-dot ${status==='drafting'?'on':''}"></span>${status==='drafting'?'Live':'Waiting'}</span>
       <span class="dd-chip"><b>${next}</b> overall · R${Math.ceil(next/TEAMS)}</span>
       <span class="dd-chip ${isMe?'mine':''}">
         <span class="dd-onclock ${isMe?'you':''}">${isMe?'You are on the clock':esc(onTeam)}</span></span>
       ${until != null && !isMe ? `<span class="dd-chip mine">${until} pick${until===1?'':'s'} until you
          <span class="muted">(#${myNext.overall})</span></span>` : ''}
       ${myNext == null && SLOT ? `<span class="dd-chip">No picks left</span>` : ''}`;
}

function render(status){
  renderStatus(status);
  renderAvail();
  renderMe();
  renderFeed();
}

/* ---- Best available, by position, with tier context ---------------------- */
function renderAvail(){
  const { taken, myNext } = state();
  const gone = pid => taken.has(String(pid)) || KEPT.has(String(pid));
  const pb = E.pos_board || {};
  const alerts = [];

  document.getElementById('avail-cols').innerHTML = POSES.filter(p => (pb[p]||[]).length).map(p => {
    const left = (pb[p]||[]).filter(r => !gone(r.pid));
    const show = left.slice(0, 8);
    // Remaining count in the top tier still on the board — this is the run signal.
    const topTier = left.length && left[0].tier != null ? left[0].tier : null;
    const inTier = topTier != null ? left.filter(r => r.tier === topTier).length : 0;
    if(topTier != null && inTier > 0 && inTier <= 2)
      alerts.push(`${p} tier ${topTier} is down to ${inTier} player${inTier===1?'':'s'}.`);

    let rows = '', seenTier = null;
    show.forEach(r => {
      if(r.tier != null && r.tier !== seenTier){
        if(seenTier !== null) rows += `<div class="tierline">— tier ${r.tier} —</div>`;
        seenTier = r.tier;
      }
      const steal = r.value != null && r.value >= 8;
      rows += `<div class="av-row ${steal?'steal':''}">
        <span class="ar">${p}${r.prank??''}</span>
        <span class="an2">${plink(r.pid, esc(r.name))}
          <span class="muted" style="font-size:11px">${esc(r.team||'')}</span></span>
        <span class="aa">${r.adp_fmt?esc(r.adp_fmt):'—'}</span></div>`;
    });

    return `<div class="av-block">
      <div class="av-head"><span class="an">${p}</span>
        <span class="am">${left.length} left${topTier!=null?` · T${topTier}×${inTier}`:''}</span></div>
      ${rows || '<div class="av-row"><span class="muted">none left</span></div>'}
    </div>`;
  }).join('');

  document.getElementById('alerts').innerHTML = alerts.slice(0,3).map(a =>
    `<div class="alert ${a.includes('1 player')?'hot':''}">⚠ ${esc(a)}</div>`).join('');
}

/* ---- My roster so far ---------------------------------------------------- */
function renderMe(){
  if(!ME){ document.getElementById('sec-me').style.display='none'; return; }
  const mine = picks.filter(p => String(p.picked_by) === String(ME.owner_id));
  const have = { [ME.pos]: 1 };                       // the keeper counts
  mine.forEach(p => { const pos = (p.metadata||{}).position; if(pos) have[pos] = (have[pos]||0)+1; });

  const st = (P && P.settings) || {};
  const rp = st.roster_positions || ['QB','RB','RB','WR','WR','TE','FLEX','K','DEF'];
  const need = {};
  rp.forEach(s => need[s] = (need[s]||0)+1);
  const pool = {...have};
  let html = '';
  Object.keys(need).forEach(s => {
    for(let i=0;i<need[s];i++){
      let filled = false;
      if(s === 'FLEX'){
        const f = ['RB','WR','TE'].find(x => (pool[x]||0) > 0);
        if(f){ pool[f]--; filled = true; }
      } else if((pool[s]||0) > 0){ pool[s]--; filled = true; }
      html += `<span class="myslot ${filled?'filled':'open'}">${esc(s)}${filled?' ✓':''}</span>`;
    }
  });
  document.getElementById('me-slots').innerHTML = html;

  document.getElementById('me-picks').innerHTML =
    `<div class="feed-row"><span class="fno">KEEP</span>
      <span class="fn">${plink(ME.pid, esc(ME.player))}</span>
      <span class="vsub muted">${esc(ME.pos)}</span></div>` +
    mine.sort((a,b)=>a.pick_no-b.pick_no).map(p => {
      const m = p.metadata||{};
      return `<div class="feed-row"><span class="fno">R${p.round}·${p.pick_no}</span>
        <span class="fn">${plink(p.player_id, esc(`${m.first_name||''} ${m.last_name||''}`.trim()||p.player_id))}</span>
        <span class="vsub muted">${esc(m.position||'')} ${esc(m.team||'')}</span></div>`;
    }).join('');
}

/* ---- Pick feed ----------------------------------------------------------- */
function renderFeed(){
  document.getElementById('feed-sub').textContent = `— ${picks.length} of ${TEAMS*ROUNDS} made`;
  document.getElementById('feed').innerHTML = picks.length
    ? picks.slice().sort((a,b)=>b.pick_no-a.pick_no).slice(0,40).map(p => {
        const m = p.metadata||{};
        const isMe = ME && String(p.picked_by) === String(ME.owner_id);
        const team = OWNERS[String(p.picked_by)] || SLOT_OWNER[p.draft_slot] || '';
        return `<div class="feed-row ${isMe?'mine':''}">
          <span class="fno">R${p.round}·${p.pick_no}</span>
          <span class="fn">${plink(p.player_id, esc(`${m.first_name||''} ${m.last_name||''}`.trim()||p.player_id))}
            <span class="muted" style="font-size:11px">${esc(m.position||'')} ${esc(m.team||'')}</span></span>
          <span class="vsub muted">${esc(team)}</span></div>`;
      }).join('')
    : '<div class="feed-row"><span class="muted">No picks yet.</span></div>';
}

init();
</script>
</body>
</html>
