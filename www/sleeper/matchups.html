<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Matchups · GGGG</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/style.css?v=18">
<link rel="stylesheet" href="/assets/viz.css?v=1">
</head>
<body data-page="matchups">
  <button class="nav-toggle" id="navToggle" aria-label="Open navigation menu">☰</button>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="content">
  <div class="page">

    <header>
      <div class="htext">
        <p class="eyebrow">Box Scores</p>
        <h1>Matchups</h1>
        <p class="subtitle" id="subtitle">Browse any week of any season.</p>
      </div>
    </header>

    <p class="updated" id="updated">&nbsp;</p>

    <div class="controls" role="group" aria-label="Matchup filters">
      <div class="ctrl"><label for="sel-season">Season</label><select class="sel" id="sel-season"></select></div>
      <div class="ctrl"><label for="sel-week">Week</label>
        <span class="wk-step"><button class="wk-btn" id="wk-prev" aria-label="Previous week">‹</button>
        <select class="sel" id="sel-week"></select>
        <button class="wk-btn" id="wk-next" aria-label="Next week">›</button></span></div>
      <div class="ctrl"><label for="sel-team">Team</label><select class="sel" id="sel-team"></select></div>
    </div>

    <section id="sec-box" aria-live="polite">
      <div class="card" id="boxscore"></div>
    </section>

    <section id="sec-others">
      <p class="section-label" id="others-label">Other Games</p>
      <div class="mini-scores" id="mini-scores"></div>
    </section>

    <footer><span>GGGG</span><span><a href="index.html">league</a> &middot; <a href="/index.html">home</a></span></footer>

  </div>
  </main>

<script src="/assets/app.js?v=23"></script>
<script src="/assets/viz.js?v=1"></script>
<script>
let META=null, DATA=null, MSEASONS=[], curSeason=null, curWeek=null, curOwner=null;
const slotLabel = s => ({WRRB_FLEX:'W/R',REC_FLEX:'W/T',SUPER_FLEX:'SFLX'}[s]||s);
const plBody = p => (p.nick && p.nick!==p.name) ? `${esc(p.nick)} <span class="muted" style="font-size:.8em">${esc(p.name)}</span>` : esc(p.name);
const plName = p => p.pid ? `<a href="player.html?pid=${p.pid}" style="color:inherit;text-decoration:none">${plBody(p)}</a>` : plBody(p);
const URLP = new URLSearchParams(location.search); let urlWeek = URLP.get('week');

async function init(){
  try { META = await fetchJSON('data/meta.json'); }
  catch(e){ document.getElementById('subtitle').textContent='Could not load data.'; return; }
  if(META) document.getElementById('updated').textContent = `Updated ${relTime(META.generated_at)}`;
  MSEASONS = META.matchup_seasons || [];
  curOwner = URLP.get('owner') || META.my_owner_id;
  if(!MSEASONS.length){ document.getElementById('boxscore').innerHTML='<p class="muted">No matchup data yet.</p>'; return; }

  const seasonSel = document.getElementById('sel-season');
  seasonSel.innerHTML = MSEASONS.map(s=>`<option value="${s}">${s} Season</option>`).join('');
  seasonSel.addEventListener('change', ()=>loadSeason(seasonSel.value));
  const startSeason = MSEASONS.includes(URLP.get('season')) ? URLP.get('season') : MSEASONS[0];
  seasonSel.value = startSeason;

  document.getElementById('sel-week').addEventListener('change', e=>{ curWeek=e.target.value; render(); });
  document.getElementById('sel-team').addEventListener('change', e=>{
    curOwner=e.target.value;
    const rid=ridForOwner();
    const plays=(DATA.weeks[curWeek]||[]).some(g=>g.a.roster_id===rid||g.b.roster_id===rid);
    if(!plays){ const w=latestWeekForOwner(); if(w){ curWeek=w; document.getElementById('sel-week').value=w; } }
    render();
  });
  document.getElementById('wk-prev').addEventListener('click', ()=>stepWeek(-1));
  document.getElementById('wk-next').addEventListener('click', ()=>stepWeek(1));

  await loadSeason(startSeason);
}

async function loadSeason(season){
  curSeason = season;
  try { DATA = await fetchJSON(`data/matchups_${season}.json`); }
  catch(e){ document.getElementById('boxscore').innerHTML='<p class="muted">Could not load season.</p>'; return; }

  // team selector
  const teams = [...DATA.teams].sort((a,b)=>a.team.localeCompare(b.team));
  const teamSel = document.getElementById('sel-team');
  teamSel.innerHTML = teams.map(t=>`<option value="${t.owner_id}">${esc(t.team)}</option>`).join('');
  // keep current owner if present this season, else first
  if(!teams.some(t=>t.owner_id===curOwner)) curOwner = teams[0].owner_id;
  teamSel.value = curOwner;

  // week selector — default to the latest week the selected team actually played
  const weekSel = document.getElementById('sel-week');
  weekSel.innerHTML = DATA.weeks_list.map(w=>{
    const playoff = Number(w) >= DATA.playoff_start ? ' (PO)' : '';
    return `<option value="${w}">Week ${w}${playoff}</option>`;
  }).join('');
  if(urlWeek && DATA.weeks_list.includes(urlWeek)){ curWeek = urlWeek; urlWeek = null; }
  else curWeek = latestWeekForOwner() || DATA.weeks_list[DATA.weeks_list.length-1];
  weekSel.value = curWeek;

  render();
}

function latestWeekForOwner(){
  const rid = ridForOwner();
  for(let i=DATA.weeks_list.length-1;i>=0;i--){
    const w = DATA.weeks_list[i];
    if((DATA.weeks[w]||[]).some(g=>g.a.roster_id===rid||g.b.roster_id===rid)) return w;
  }
  return null;
}

function stepWeek(d){
  const i = DATA.weeks_list.indexOf(String(curWeek));
  const ni = i + d;
  if(ni<0 || ni>=DATA.weeks_list.length) return;
  curWeek = DATA.weeks_list[ni];
  document.getElementById('sel-week').value = curWeek;
  render();
}

function ridForOwner(){
  const t = DATA.teams.find(t=>t.owner_id===curOwner);
  return t ? t.roster_id : null;
}

function render(){
  const i = DATA.weeks_list.indexOf(String(curWeek));
  document.getElementById('wk-prev').disabled = i<=0;
  document.getElementById('wk-next').disabled = i>=DATA.weeks_list.length-1;

  const games = DATA.weeks[curWeek] || [];
  const rid = ridForOwner();
  // find this team's game
  let g=null, mine='a', opp='b';
  for(const game of games){
    if(game.a.roster_id===rid){ g=game; mine='a'; opp='b'; break; }
    if(game.b.roster_id===rid){ g=game; mine='b'; opp='a'; break; }
  }
  const box = document.getElementById('boxscore');
  if(!g){ box.innerHTML='<p class="muted">This team did not play a matchup this week.</p>'; }
  else {
    const me=g[mine], ot=g[opp];
    box.innerHTML = boxscore(me, ot);
    if(window.SCviz){
      SCviz.odometerAll(box);
      const mt=box.querySelector('.pos-battle');
      if(mt) SCviz.positionalBattle(mt, me, ot);
    }
  }

  // other games
  document.getElementById('others-label').textContent = `Other Games · Week ${curWeek}`;
  document.getElementById('mini-scores').innerHTML = games.filter(x=>x!==g).map(x=>{
    const aw=x.a.points>x.b.points, bw=x.b.points>x.a.points;
    return `<div class="mini-game" data-rid="${x.a.roster_id}">
      <div class="mini-row ${aw?'win':'lose'}"><span>${esc(x.a.team)}</span><span>${x.a.points.toFixed(1)}</span></div>
      <div class="mini-row ${bw?'win':'lose'}"><span>${esc(x.b.team)}</span><span>${x.b.points.toFixed(1)}</span></div></div>`;
  }).join('') || '<p class="muted">No other games.</p>';
  document.querySelectorAll('.mini-game').forEach(el=>el.addEventListener('click', ()=>{
    const t=DATA.teams.find(t=>t.roster_id===Number(el.dataset.rid));
    if(t){ curOwner=t.owner_id; document.getElementById('sel-team').value=curOwner; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  }));
}

function boxscore(me, ot){
  const meStart = me.players.filter(p=>p.starter);
  const otStart = ot.players.filter(p=>p.starter);
  const meWin = me.points>ot.points, tie = me.points===ot.points;
  const rb = tie?'rb-t':meWin?'rb-w':'rb-l';
  const rbTxt = tie?'TIE':meWin?'WON':'LOST';
  const margin = Math.abs(me.points-ot.points).toFixed(1);

  let rows='';
  const n=Math.max(meStart.length, otStart.length);
  for(let i=0;i<n;i++){
    const a=meStart[i], b=otStart[i];
    const aHi=a&&b&&a.pts>b.pts, bHi=a&&b&&b.pts>a.pts;
    rows += `<div class="bs-row">
      <div class="bs-side left">${a?`<span class="bs-pt ${aHi?'hi':''}">${a.pts.toFixed(1)}</span>${headshotHTML(a.pid,a.pos,a.nfl_team)}<span class="bs-nm">${plName(a)}${injuryBadge(a.injury)}</span>`:''}</div>
      <div class="bs-slot">${esc(slotLabel((a||b).slot))}</div>
      <div class="bs-side">${b?`<span class="bs-pt ${bHi?'hi':''}">${b.pts.toFixed(1)}</span>${headshotHTML(b.pid,b.pos,b.nfl_team)}<span class="bs-nm">${plName(b)}${injuryBadge(b.injury)}</span>`:''}</div>
    </div>`;
  }
  const meBench = me.players.filter(p=>!p.starter).sort((x,y)=>y.pts-x.pts);
  const otBench = ot.players.filter(p=>!p.starter).sort((x,y)=>y.pts-x.pts);
  const benchLine = arr => arr.map(p=>`${esc(p.name)} ${p.pts.toFixed(1)}`).join(' · ');

  return `<div style="--accent:${esc(me.color||'var(--accent)')}">
    <div style="text-align:center;margin-bottom:14px"><span class="result-badge ${rb}">${rbTxt} by ${margin}</span></div>
    <div class="bs-head">
      <div class="bs-team"><span class="team-dot" style="background:${esc(me.color||'var(--muted)')}"></span><span class="nm">${esc(me.team)}</span></div>
      <div style="text-align:center"><span class="bs-score ${meWin?'win':'lose'}" data-odo="${me.points.toFixed(1)}">${me.points.toFixed(1)}</span>
        <span class="bs-vs"> – </span><span class="bs-score ${!meWin&&!tie?'win':'lose'}" data-odo="${ot.points.toFixed(1)}">${ot.points.toFixed(1)}</span></div>
      <div class="bs-team right"><span class="nm">${esc(ot.team)}</span><span class="team-dot" style="background:${esc(ot.color||'var(--muted)')}"></span></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 50px 1fr;gap:8px;font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px">
      <span>optimal ${me.optimal.toFixed(1)}</span><span></span><span>optimal ${ot.optimal.toFixed(1)}</span></div>
    ${rows}
    <div class="bs-tot"><div class="l">${me.points.toFixed(1)}</div><div class="bs-slot">TOT</div><div class="r">${ot.points.toFixed(1)}</div></div>
    <div class="pos-battle"></div>
    <div class="bs-bench"><strong>${esc(me.team)} bench:</strong> ${benchLine(meBench)||'—'}</div>
    <div class="bs-bench"><strong>${esc(ot.team)} bench:</strong> ${benchLine(otBench)||'—'}</div>
  </div>`;
}

init();
</script>
</body>
</html>
