<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Player · GGGG</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/style.css?v=25">
</head>
<body data-page="player">
  <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="content">
  <div class="page">

    <header id="head">
      <div class="htext">
        <p class="eyebrow" id="eyebrow">Player</p>
        <h1 id="pname">Loading…</h1>
        <p class="subtitle" id="subtitle">&nbsp;</p>
      </div>
    </header>

    <p class="updated" id="updated">&nbsp;</p>

    <section id="sec-summary"><div class="stat-grid" id="summary-grid"></div></section>

    <div id="nicknames"></div>

    <section id="sec-log">
      <p class="section-label">Game Log <span class="sub">— every recorded week in the league</span></p>
      <div id="logs"></div>
      <div class="legend">
        <span><b>Start</b> = in the starting lineup that week · <span class="muted">bench</span> = rostered but not started</span>
        <span>PO = playoff week · Team = who rostered them that week (click to open that matchup)</span>
      </div>
    </section>

    <footer><span>GGGG</span><span><a href="teams.html">teams</a> &middot; <a href="index.html">league</a></span></footer>

  </div>
  </main>

<script src="/assets/app.js?v=28"></script>
<script>
const params = new URLSearchParams(location.search);
const pid = params.get('pid');
const teamLink = (team, oid) => (team && oid)
  ? `<a class="team-link" href="team.html?owner=${encodeURIComponent(oid)}"><span class="team-name">${esc(team)}</span></a>`
  : `<span class="muted">${esc(team||'—')}</span>`;
// Link a game-log row to that exact matchup (season/week/team resolves to one game).
const matchLink = r => (r.team && r.owner_id)
  ? `<a class="team-link" href="matchups.html?season=${encodeURIComponent(r.season)}&week=${r.week}&owner=${encodeURIComponent(r.owner_id)}"><span class="team-name">${esc(r.team)}</span></a>`
  : `<span class="muted">${esc(r.team||'—')}</span>`;
const cell = v => (v==null || v===0 || v==='0/0') ? '<span class="muted">·</span>' : v;
// Position-relevant box-score columns: [label, getter(statLine)].
const COLS = {
  QB:[['C/A',s=>s.pass_att?`${s.pass_cmp||0}/${s.pass_att}`:null],['PaYd',s=>s.pass_yd],['PaTD',s=>s.pass_td],['INT',s=>s.pass_int],['RuYd',s=>s.rush_yd],['RuTD',s=>s.rush_td]],
  RB:[['Car',s=>s.rush_att],['RuYd',s=>s.rush_yd],['RuTD',s=>s.rush_td],['Rec',s=>s.rec],['ReYd',s=>s.rec_yd],['ReTD',s=>s.rec_td]],
  WR:[['Tgt',s=>s.rec_tgt],['Rec',s=>s.rec],['ReYd',s=>s.rec_yd],['ReTD',s=>s.rec_td],['RuYd',s=>s.rush_yd]],
  TE:[['Tgt',s=>s.rec_tgt],['Rec',s=>s.rec],['ReYd',s=>s.rec_yd],['ReTD',s=>s.rec_td],['RuYd',s=>s.rush_yd]],
  K:[['FGM',s=>s.fgm],['FGA',s=>s.fga],['XP',s=>s.xpm]],
  DEF:[['Sack',s=>s.def_sack!=null?s.def_sack:s.sack],['INT',s=>s.def_int],['DefTD',s=>s.def_td],['FF',s=>s.def_ff],['PA',s=>s.pts_allow]],
};
const headImg = P => (P.pos==='DEF' && P.nfl_team)
  ? `<img class="head-avatar" src="https://sleepercdn.com/images/team_logos/nfl/${esc((P.nfl_team||'').toLowerCase())}.png" alt="" onerror="this.style.visibility='hidden'">`
  : `<img class="head-avatar" src="https://sleepercdn.com/content/nfl/players/thumb/${esc(P.pid)}.jpg" alt="" onerror="this.style.visibility='hidden'">`;

async function init(){
  let M;
  try { M = await fetchJSON('data/meta.json'); } catch(e){}
  if(M) document.getElementById('updated').textContent = `Updated ${relTime(M.generated_at)}`;
  if(!pid){ document.getElementById('pname').textContent = 'No player selected'; return; }

  let P;
  try { P = await fetchJSON(`data/players/${pid}.json`); }
  catch(e){ document.getElementById('pname').textContent = 'Player not found';
    document.getElementById('subtitle').textContent = 'No league game log on record for this player.'; return; }

  document.title = `${P.name} · GGGG`;
  document.getElementById('eyebrow').innerHTML = `${posPill(P.pos)} ${esc(P.nfl_team||'FA')}${P.age?` · age ${P.age}`:''}`;
  document.getElementById('pname').textContent = P.name;
  document.getElementById('head').insertAdjacentHTML('afterbegin', headImg(P));
  const s = P.summary;
  document.getElementById('subtitle').innerHTML =
    `${s.started} start${s.started!==1?'s':''} / ${s.games} rostered week${s.games!==1?'s':''}` +
    (s.teams && s.teams.length ? ` · ${s.teams.map(esc).join(', ')}` : '');

  document.getElementById('summary-grid').innerHTML = [
    ['Started Points', s.started_pts.toFixed(1), `${s.ppg_started.toFixed(1)} PPG when started`],
    ['Games Started', `${s.started}`, `of ${s.games} rostered · ${s.games?Math.round(s.started/s.games*100):0}%`],
    ['Best Game', s.best?s.best.pts.toFixed(1):'—', s.best?`${s.best.season} Wk ${s.best.week} · ${s.best.team}`:''],
    ['Seasons', `${s.seasons.length}`, s.seasons.join(', ')],
  ].map(([l,v,sub])=>`<div class="stat-card"><div class="stat-label">${esc(l)}</div>
    <div class="stat-value">${esc(v)}</div><div class="stat-sub">${esc(sub)}</div></div>`).join('');

  // Nicknames given by managers over the years
  if (P.nicknames && P.nicknames.length) {
    document.getElementById('nicknames').innerHTML =
      `<p class="section-label" style="margin-bottom:8px">Nicknames <span class="sub">— given by managers over the years</span></p>`
      + `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px">`
      + P.nicknames.map(n => `<span style="display:inline-flex;align-items:baseline;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:5px 11px;font-size:13px"><b style="font-style:italic">&ldquo;${esc(n.nick)}&rdquo;</b>${n.team?`<span class="muted" style="font-size:11px">${esc(n.team)}</span>`:''}</span>`).join('')
      + `</div>`;
  }

  // Group log by season, newest first
  const bySeason = {};
  P.log.forEach(g => (bySeason[g.season] = bySeason[g.season] || []).push(g));
  const seasons = Object.keys(bySeason).sort().reverse();
  const cols = COLS[P.pos] || [];
  const colHead = cols.map(c=>`<th class="num">${c[0]}</th>`).join('');
  document.getElementById('logs').innerHTML = seasons.map(season => {
    const rows = bySeason[season].slice().sort((a,b)=>b.week-a.week);
    const started = rows.filter(r=>r.started);
    const startedPts = started.reduce((t,r)=>t+r.pts,0);
    const totPts = rows.reduce((t,r)=>t+r.pts,0);
    const tot = {}; rows.forEach(r => Object.entries(r.st||{}).forEach(([k,v]) => tot[k]=(tot[k]||0)+v));
    const bye = P.byes && P.byes[season];
    const totCells = cols.map(c=>`<td class="num muted">${cell(c[1](tot))}</td>`).join('');
    return `<div class="card table-wrap" style="margin-bottom:14px">
      <div class="rlabel" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;padding:2px 2px 10px">
        ${esc(season)} <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">· ${started.length} starts · ${startedPts.toFixed(1)} pts${bye?` · <span style="color:var(--amber)">Bye Wk ${bye}</span>`:''}</span></div>
      <table><thead><tr><th class="rank-cell">Wk</th><th>FF Team</th><th class="num">Role</th><th class="num">Pts</th>${colHead}</tr></thead><tbody>` +
      rows.map(r=>{
        const st = r.st || {};
        const statCells = cols.map(c=>`<td class="num${r.started?'':' muted'}">${cell(c[1](st))}</td>`).join('');
        return `<tr>
          <td class="rank-cell">${r.week}${r.playoff?'<span class="muted" style="font-size:10px"> PO</span>':''}</td>
          <td>${matchLink(r)}</td>
          <td class="num">${r.started?'<span style="color:var(--green);font-weight:700;font-size:11px">START</span>':'<span class="muted">bench</span>'}</td>
          <td class="num${r.started?'':' muted'}" style="font-weight:700">${r.pts.toFixed(1)}</td>${statCells}</tr>`;
      }).join('') +
      `<tr style="border-top:2px solid var(--border)"><td class="rank-cell muted">Σ</td><td class="muted" style="font-size:12px">season total</td><td class="num muted">${started.length} gs</td><td class="num" style="font-weight:700">${totPts.toFixed(1)}</td>${totCells}</tr>` +
      `</tbody></table></div>`;
  }).join('') || '<p class="muted">No game log.</p>';
}
init();
</script>
</body>
</html>
