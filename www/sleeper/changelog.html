<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Changelog · GGGG</title>
<link rel="stylesheet" href="/assets/style.css?v=16">
</head>
<body data-page="changelog">
  <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="content">
  <div class="page">

    <header>
      <div class="htext">
        <p class="eyebrow">What's New</p>
        <h1>Changelog</h1>
        <p class="subtitle">Every change to the site, explained — newest first.</p>
      </div>
    </header>

    <p class="updated" id="updated">&nbsp;</p>

    <section id="sec-log"><div class="timeline" id="log"></div></section>

    <footer><span>GGGG</span><span><a href="/sitemap.html">sitemap</a> &middot; <a href="index.html">league</a> &middot; <a href="/index.html">home</a></span></footer>

  </div>
  </main>

<script src="/assets/app.js?v=21"></script>
<script>
const TAGS = {
  feature: ['Feature', 'tag-feature'],
  fix:     ['Fix', 'tag-fix'],
  infra:   ['Infrastructure', 'tag-infra'],
  docs:    ['Docs', 'tag-docs'],
};

async function init(){
  let C, M;
  try { [C, M] = await Promise.all([fetchJSON('data/changelog.json'), fetchJSON('data/meta.json').catch(()=>null)]); }
  catch(e){ document.getElementById('log').innerHTML='<p class="muted">Could not load changelog.</p>'; console.error(e); return; }
  if(M) document.getElementById('updated').textContent = `Site data updated ${relTime(M.generated_at)}`;

  document.getElementById('log').innerHTML = C.entries.map(en => {
    const [label, cls] = TAGS[en.tag] || ['Update', 'tag-docs'];
    const items = (en.items||[]).map(it =>
      `<li><strong>${esc(it.h)}.</strong> ${esc(it.d)}</li>`).join('');
    return `<div class="cl-entry">
      <div class="cl-rail"><span class="cl-dot"></span></div>
      <div class="cl-body">
        <div class="cl-head"><span class="cl-tag ${cls}">${label}</span>
          <span class="cl-date">${esc(en.date)}</span></div>
        <h2 class="cl-title">${esc(en.title)}</h2>
        ${en.summary?`<p class="cl-summary">${esc(en.summary)}</p>`:''}
        <ul class="cl-items">${items}</ul>
      </div>
    </div>`;
  }).join('');
}
init();
</script>
</body>
</html>
