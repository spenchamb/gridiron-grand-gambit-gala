<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Teams · GGGG</title>
<link rel="stylesheet" href="/assets/style.css?v=16">
</head>
<body data-page="teams">
  <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="content">
  <div class="page">

    <header>
      <div class="htext">
        <p class="eyebrow">All Managers</p>
        <h1>Teams</h1>
        <p class="subtitle" id="subtitle">Loading&hellip;</p>
      </div>
    </header>

    <p class="updated" id="updated">&nbsp;</p>

    <section id="sec-grid">
      <div class="teams-grid" id="teams-grid"></div>
    </section>

    <section id="sec-table">
      <p class="section-label">All-Time Standings</p>
      <div class="card table-wrap"><table id="at-table"><tbody></tbody></table></div>
    </section>

    <footer><span>GGGG</span><span><a href="index.html">league</a> &middot; <a href="/index.html">home</a></span></footer>

  </div>
  </main>

<script src="/assets/app.js?v=21"></script>
<script>
async function init(){
  let T, M;
  try { [T, M] = await Promise.all([fetchJSON('data/teams.json'), fetchJSON('data/meta.json')]); }
  catch(e){ document.getElementById('subtitle').textContent='Could not load teams.'; console.error(e); return; }

  document.getElementById('subtitle').textContent = `${T.length} managers across ${M.seasons.length} season${M.seasons.length>1?'s':''}`;
  document.getElementById('updated').textContent = `Updated ${relTime(M.generated_at)}`;

  document.getElementById('teams-grid').innerHTML = T.map(t => {
    const rings = t.championships ? `<div class="tt-rings">${'🏆'.repeat(t.championships)} ${t.championships} title${t.championships>1?'s':''}</div>` : '';
    return `<a class="team-tile" href="team.html?owner=${encodeURIComponent(t.owner_id)}">
      ${avatarHTML(t.avatar, t.team, 'tt-avatar')}
      <div style="min-width:0">
        <div class="tt-name">${esc(t.team)}</div>
        <div class="tt-sub">${esc(t.owner)} · ${esc(t.record)} all-time · ${(t.win_pct*100).toFixed(0)}%</div>
        ${rings || `<div class="tt-sub">${t.seasons} season${t.seasons>1?'s':''} · best finish ${t.best_finish}</div>`}
      </div></a>`;
  }).join('');

  document.getElementById('at-table').innerHTML =
    `<thead><tr><th class="rank-cell">#</th><th>Manager</th><th class="num">Record</th><th class="num">Win%</th>
     <th class="num">PF</th><th class="num">Titles</th><th class="num">Best</th></tr></thead><tbody>` +
    T.map((t,i)=>`<tr>
      <td class="rank-cell">${i+1}</td>
      <td><a class="team-link" href="team.html?owner=${encodeURIComponent(t.owner_id)}"><div class="team-cell">${avatarHTML(t.avatar,t.team)}<span class="team-name">${esc(t.team)}</span></div></a>
        <div class="muted" style="font-size:12px;padding-left:36px">${esc(t.owner)}</div></td>
      <td class="num">${esc(t.record)}</td><td class="num">${(t.win_pct*100).toFixed(1)}%</td>
      <td class="num muted">${t.pf.toFixed(0)}</td>
      <td class="num">${t.championships?'🏆'.repeat(t.championships):'<span class="muted">—</span>'}</td>
      <td class="num muted">${t.best_finish}</td></tr>`).join('') + '</tbody>';
}
init();
</script>
</body>
</html>
