# static-web-server config for the FF-only bundle (gridirongrandgambitgala.xyz)
# Flattened layout: data lives at /data, pages at root.
# Everything revalidates on every load (no-cache) — this site changes too
# often to trust long-lived asset caching.

[advanced]

[[advanced.headers]]
source = "/data/**"
[advanced.headers.headers]
Cache-Control = "no-cache"

[[advanced.headers]]
source = "/assets/**"
[advanced.headers.headers]
Cache-Control = "no-cache"

[[advanced.headers]]
source = "**/*.html"
[advanced.headers.headers]
Cache-Control = "no-cache"
