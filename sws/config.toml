# static-web-server config — per-path cache headers
# Everything revalidates on every load (no-cache = always ask the server,
# 304 when unchanged) so nothing goes stale in a browser after a deploy —
# this site changes too often to trust long-lived asset caching.

[advanced]

[[advanced.headers]]
source = "/sleeper/data/**"
[advanced.headers.headers]
Cache-Control = "no-cache"

[[advanced.headers]]
source = "/assets/**"
[advanced.headers.headers]
Cache-Control = "no-cache"

[[advanced.headers]]
source = "/status.json"
[advanced.headers.headers]
Cache-Control = "no-cache"

[[advanced.headers]]
source = "**/*.html"
[advanced.headers.headers]
Cache-Control = "no-cache"

[[advanced.headers]]
source = "/links.txt"
[advanced.headers.headers]
Cache-Control = "no-cache"

[[advanced.headers]]
source = "/nba/data/**"
[advanced.headers.headers]
Cache-Control = "no-cache"
